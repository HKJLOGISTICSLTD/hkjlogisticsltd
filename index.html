<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Ride - HKJ Logistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-lg w-full">
        <div class="text-center mb-8">
            <div class="text-5xl mb-3">🚗</div>
            <h1 class="text-3xl font-bold text-gray-800">HKJ Logistics</h1>
            <p class="text-gray-500 mt-2">Book your ride today</p>
        </div>

        <form id="bookingForm" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Full Name</label>
                <input type="text" name="clientName" required 
                    class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Phone</label>
                    <input type="tel" name="clientPhone" required 
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Email</label>
                    <input type="email" name="clientEmail" required 
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Date</label>
                    <input type="date" name="bookDate" required 
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Time</label>
                    <input type="time" name="bookTime" required 
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Pickup Address</label>
                <input type="text" name="pickupAddressText" required 
                    class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="hidden" name="pickupCity" value="Trinidad">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Drop-off Address</label>
                <input type="text" name="dropoffAddressText" required 
                    class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="hidden" name="dropoffCity" value="Trinidad">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Vehicle Type</label>
                <select name="vehicleType" 
                    class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                    <option value="Sedan (1-4 Passengers)">Sedan (1-4 Passengers)</option>
                    <option value="Minivan (5-7 Passengers)">Minivan (5-7 Passengers)</option>
                    <option value="Minibus (8-14 Passengers)">Minibus (8-14 Passengers)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Additional Notes</label>
                <textarea name="additionalNotes" rows="3" 
                    class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg transition transform hover:scale-[1.02] shadow-lg mt-4">
                <i class="fas fa-paper-plane mr-2"></i> Submit Booking
            </button>
        </form>
    </div>

    <!-- Success Message -->
    <div id="success-container" class="hidden bg-white rounded-2xl shadow-xl p-8 max-w-lg w-full text-center">
        <div class="text-green-500 text-8xl mb-4">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1 class="text-4xl font-bold text-green-500 mb-4">THANK YOU!</h1>
        <p class="text-gray-600 mb-6 text-lg">Thank you for choosing HKJ Logistics. Your booking request has been successfully received!</p>
        
        <p class="text-gray-800 font-semibold mb-2">Your Reference Code is:</p>
        <div class="bg-black text-yellow-400 text-4xl font-bold py-4 px-6 rounded-xl mb-6 tracking-wider" id="displayCode">
            HKJ-0000
        </div>
        
        <p class="text-gray-500 mb-8">An Admin will contact you shortly with the final price. Once confirmed, please click CONFIRM BOOKING to lock it in!</p>
        
        <button onclick="window.location.href='/'" 
            class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full transition transform hover:scale-105 shadow-lg text-xl">
            GOT IT!
        </button>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx6xDIYPUdE0Vxl3ndy1axkjX0Y6MWYYNRJ7tla1o-nUUPEMpcssfucjxL3qZIXnHdj/exec';

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Sending...';

            const refCode = 'HKJ-' + Math.floor(1000 + Math.random() * 9000);
            const formData = new FormData(this);
            formData.append('referenceCode', refCode);

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === 'success') {
                    document.getElementById('form-container').parentElement.querySelector('.bg-white').classList.add('hidden');
                    document.getElementById('success-container').classList.remove('hidden');
                    document.getElementById('displayCode').innerText = refCode;
                } else {
                    alert('Error: ' + data.message);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                }
            })
            .catch(error => {
                alert('Network error. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            });
        });
    </script>
</body>
</html>
