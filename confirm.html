<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Booking - HKJ Logistics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.9)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920&q=80'); background-size: cover; background-position: center; min-height: 100vh; color: white; }
    .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    .btn-confirm { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .btn-decline { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .btn-whatsapp { background: linear-gradient(135deg, #25D366, #128C7E); }
  </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center">
  <div class="max-w-2xl w-full">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-yellow-400 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
        <i class="fas fa-truck text-black text-2xl"></i>
      </div>
      <h1 class="text-3xl font-bold">HKJ <span class="text-yellow-400">Logistics</span></h1>
      <p class="text-gray-300 mt-2">Booking Confirmation</p>
    </div>

    <div id="loading" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-yellow-400 border-t-transparent"></div>
      <p class="mt-4 text-lg">Loading booking details...</p>
    </div>

    <div id="bookingDetails" class="hidden glass-card rounded-2xl shadow-2xl p-6 md:p-8">
      <div class="flex justify-between items-start mb-6 pb-4 border-b border-white/20">
        <div>
          <h2 class="text-2xl font-bold text-yellow-400" id="refCode">Loading...</h2>
          <p class="text-sm text-gray-300 mt-1" id="statusBadge">Status: Pending</p>
        </div>
      </div>

      <div class="space-y-4 mb-6">
        <div class="flex items-start bg-white/5 p-4 rounded-xl">
          <i class="fas fa-user text-blue-400 mt-1 mr-3"></i>
          <div><p class="text-xs text-gray-400 uppercase font-bold">Client Name</p><p class="font-semibold" id="clientName">-</p></div>
        </div>
        <div class="flex items-start bg-white/5 p-4 rounded-xl">
          <i class="fas fa-map-marker-alt text-green-400 mt-1 mr-3"></i>
          <div><p class="text-xs text-gray-400 uppercase font-bold">Pickup</p><p class="font-semibold" id="pickup">-</p></div>
        </div>
        <div class="flex items-start bg-white/5 p-4 rounded-xl">
          <i class="fas fa-flag-checkered text-red-400 mt-1 mr-3"></i>
          <div><p class="text-xs text-gray-400 uppercase font-bold">Drop-off</p><p class="font-semibold" id="dropoff">-</p></div>
        </div>
        <div class="flex items-start bg-white/5 p-4 rounded-xl">
          <i class="fas fa-calendar-alt text-purple-400 mt-1 mr-3"></i>
          <div><p class="text-xs text-gray-400 uppercase font-bold">Date & Time</p><p class="font-semibold" id="dateTime">-</p></div>
        </div>
      </div>

      <div class="bg-yellow-400/10 border border-yellow-400/30 rounded-xl p-6 text-center mb-6">
        <p class="text-sm text-yellow-200 uppercase font-bold mb-2">Quoted Final Price</p>
        <p class="text-4xl font-bold text-white" id="priceTTD">$0.00 TTD</p>
        <p class="text-xl font-semibold text-blue-300" id="priceUSD">$0 USD</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <button onclick="updateBookingStatus('Confirmed')" class="btn-confirm text-white font-bold py-4 rounded-xl shadow-lg hover:opacity-90 transition flex items-center justify-center">
          <i class="fas fa-check mr-2"></i> Confirm Booking
        </button>
        <button onclick="updateBookingStatus('Cancelled')" class="btn-decline text-white font-bold py-4 rounded-xl shadow-lg hover:opacity-90 transition flex items-center justify-center">
          <i class="fas fa-times mr-2"></i> Decline Booking
        </button>
      </div>

      <div class="mt-6 text-center">
        <button onclick="shareOnWhatsApp()" class="btn-whatsapp text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:opacity-90 transition flex items-center justify-center mx-auto">
          <i class="fab fa-whatsapp mr-2 text-xl"></i> Share Confirmation on WhatsApp
        </button>
      </div>
    </div>

    <div id="successMessage" class="hidden glass-card rounded-2xl shadow-2xl p-8 text-center">
      <div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg">
        <i class="fas fa-check text-white text-4xl"></i>
      </div>
      <h2 class="text-2xl font-bold mb-2">Booking Updated!</h2>
      <p class="text-gray-300 mb-6">Thank you. Our team has been notified of your decision.</p>
      <button onclick="location.reload()" class="bg-white/20 hover:bg-white/30 text-white font-bold py-3 px-6 rounded-xl transition">Back to Details</button>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwVyYUxmhxqA01l1i1tDqT_qJekDTYREe5iv1PlFZaN7IjKCMt-nudsgZquPwXx2CFfxg/exec'; 
    let currentBooking = null;
    let currentRow = null;

    function cleanDateTime(dateVal, timeVal) {
        let dStr = "N/A";
        let tStr = "N/A";
        if (dateVal) {
            let d = new Date(dateVal);
            if (!isNaN(d.getTime())) { dStr = d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }); } 
            else { dStr = dateVal; }
        }
        if (timeVal) {
            if (timeVal.toString().includes('1899')) {
                let match = timeVal.toString().match(/T(\d{2}:\d{2})/);
                if (match) {
                    let parts = match[1].split(':');
                    let h = parseInt(parts[0]); let m = parts[1];
                    let ampm = h >= 12 ? 'PM' : 'AM';
                    h = h % 12; h = h ? h : 12;
                    tStr = h + ':' + m + ' ' + ampm;
                }
            } else { tStr = timeVal; }
        }
        return { date: dStr, time: tStr };
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      if (!code) { document.getElementById('loading').innerHTML = '<p class="text-red-400 font-bold">No booking code provided.</p>'; return; }
      fetch(APPS_SCRIPT_URL).then(res => res.json()).then(data => {
        if (data.success) {
          const booking = data.bookings.find(b => b['REF CODE'] === code);
          if (booking) { currentBooking = booking; currentRow = booking._rowNumber; displayBooking(booking); } 
          else { document.getElementById('loading').innerHTML = '<p class="text-red-400 font-bold">Booking not found.</p>'; }
        }
      }).catch(err => { document.getElementById('loading').innerHTML = '<p class="text-red-400 font-bold">Error loading data.</p>'; });
    });

    function displayBooking(booking) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('bookingDetails').classList.remove('hidden');
      document.getElementById('refCode').textContent = booking['REF CODE'];
      document.getElementById('statusBadge').textContent = 'Status: ' + (booking.STATUS || 'Pending');
      document.getElementById('clientName').textContent = booking.NAME || 'N/A';
      document.getElementById('pickup').textContent = booking['PICK UP'] || 'N/A';
      document.getElementById('dropoff').textContent = booking['DROP OFF'] || 'N/A';
      const cleanDT = cleanDateTime(booking.DATE, booking.TIME);
      document.getElementById('dateTime').textContent = cleanDT.date + ' at ' + cleanDT.time;
      const price = parseFloat(booking['FINAL PRICE'] || booking['FARES'] || 0);
      const usd = Math.round(price / 6.80);
      document.getElementById('priceTTD').textContent = '$' + price.toFixed(2) + ' TTD';
      document.getElementById('priceUSD').textContent = '$' + usd + ' USD';
    }

    function updateBookingStatus(status) {
      if (!confirm('Are you sure you want to ' + (status === 'Confirmed' ? 'confirm' : 'decline') + ' this booking?')) return;
      fetch(APPS_SCRIPT_URL, { method: 'POST', body: new URLSearchParams({ action: 'updateStatus', row: currentRow, status: status }) })
      .then(res => res.json()).then(data => {
        if (data.success) { document.getElementById('bookingDetails').classList.add('hidden'); document.getElementById('successMessage').classList.remove('hidden'); }
      }).catch(err => alert('Error updating status.'));
    }

    function shareOnWhatsApp() {
      if (!currentBooking) return;
      const refCode = currentBooking['REF CODE'];
      const pickup = currentBooking['PICK UP'] || 'N/A';
      const dropoff = currentBooking['DROP OFF'] || 'N/A';
      const cleanDT = cleanDateTime(currentBooking.DATE, currentBooking.TIME);
      const price = parseFloat(currentBooking['FINAL PRICE'] || currentBooking['FARES'] || 0);
      const usd = Math.round(price / 6.80);
      let msg = 'Hello HKJ Logistics,\n\nI would like to confirm my booking ' + refCode + '.\n\n';
      msg += 'PICKUP: ' + pickup + '\n\n';
      msg += 'DROP-OFF: ' + dropoff + '\n\n';
      msg += 'DATE: ' + cleanDT.date + '\n\n';
      msg += 'TIME: ' + cleanDT.time + '\n\n';
      msg += '*TOTAL PRICE: $' + price.toFixed(2) + ' TTD ($' + usd + ' USD)*\n\n';
      msg += 'Thank you!';
      const phone = '18687800300'; 
      const url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(msg);
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
