<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Booking - HKJ Logistics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=2070&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-2xl w-full">
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">✅</div>
      <h1 class="text-3xl font-bold text-gray-800">Confirm Your Booking</h1>
      <p class="text-gray-600 mt-2">HKJ Logistics - Please confirm your reservation</p>
    </div>

    <form id="confirmForm" class="space-y-6">
      <!-- Reference Code Field -->
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Enter Reference Code *</label>
        <input type="text" id="refCode" placeholder="e.g., HKJ-7921 or hkj7921" required 
          class="w-full p-4 text-center text-2xl font-bold border-2 border-gray-300 rounded-lg focus:outline-none focus:border-green-500 transition"
          oninput="fetchBookingData()">
        <p class="text-sm text-gray-500 mt-2">Found in your booking confirmation popup or WhatsApp message.</p>
      </div>

      <!-- Auto-filled Booking Details -->
      <div id="bookingDetails" class="hidden bg-green-50 border-2 border-green-500 rounded-lg p-6">
        <h3 class="text-lg font-bold text-green-800 mb-4"><i class="fas fa-check-circle mr-2"></i>Booking Found!</h3>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Client Name</label>
            <input type="text" id="clientName" readonly class="w-full p-3 bg-white border border-gray-300 rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Phone</label>
            <input type="text" id="clientPhone" readonly class="w-full p-3 bg-white border border-gray-300 rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Date</label>
            <input type="text" id="bookDate" readonly class="w-full p-3 bg-white border border-gray-300 rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Time</label>
            <input type="text" id="bookTime" readonly class="w-full p-3 bg-white border border-gray-300 rounded-lg">
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-bold text-gray-700 mb-1">Pickup Address</label>
          <input type="text" id="pickupAddress" readonly class="w-full p-3 bg-white border border-gray-300 rounded-lg">
        </div>

        <div class="mb-4">
          <label class="block text-sm font-bold text-gray-700 mb-1">Drop-off Address</label>
          <input type="text" id="dropoffAddress" readonly class="w-full p-3 bg-white border border-gray-300 rounded-lg">
        </div>

        <div class="bg-yellow-100 border border-yellow-500 rounded-lg p-4">
          <p class="text-sm font-bold text-yellow-800 mb-2">Final Price:</p>
          <p class="text-3xl font-bold text-yellow-700" id="finalPrice">$0.00 TTD</p>
        </div>
      </div>

      <!-- Payment Method -->
      <div id="paymentSection" class="hidden">
        <label class="block text-sm font-bold text-gray-700 mb-2">Preferred Payment Method *</label>
        <select id="paymentMethod" required class="w-full p-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-green-500">
          <option value="">Select payment method...</option>
          <option value="Cash">Cash</option>
          <option value="Bank Transfer">Bank Transfer</option>
          <option value="Credit Card">Credit Card</option>
        </select>
      </div>

      <!-- Confirm Button -->
      <button type="submit" id="confirmBtn" disabled
        class="w-full bg-green-600 hover:bg-green-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-bold py-4 rounded-lg transition transform hover:scale-105 shadow-lg">
        <i class="fas fa-check-circle mr-2"></i> Confirm Booking
      </button>
    </form>

    <!-- Loading State -->
    <div id="loading" class="hidden text-center py-8">
      <i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i>
      <p class="mt-4 text-gray-700">Searching for booking...</p>
    </div>

    <!-- Error State -->
    <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mt-4">
      <i class="fas fa-exclamation-circle mr-2"></i>
      <span id="errorText"></span>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚠️ REPLACE THIS WITH YOUR ACTUAL APPS SCRIPT URL
    // ==========================================
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNo3KIAixrT9WUVQV1FAzvKbq7ev88R9I4b8RA-KNffMlNHzryLLzLelPi0bpbqMoc/exec';
    
    let bookingData = null;

    // Auto-fill from URL parameter if exists
    window.addEventListener('DOMContentLoaded', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      if (code) {
        document.getElementById('refCode').value = code.toUpperCase();
        fetchBookingData();
      }
    });

    // Normalize code: uppercase, remove dashes and spaces
    function normalizeCode(code) {
      return code.toUpperCase().replace(/[-\s]/g, '');
    }

    async function fetchBookingData() {
      const refCode = document.getElementById('refCode').value.trim();
      
      if (refCode.length < 5) {
        hideBookingDetails();
        return;
      }

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('errorMessage').classList.add('hidden');

      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();
        
        if (data.success) {
          // Normalize the search code
          const searchCode = normalizeCode(refCode);
          
          // Find booking with normalized comparison
          const booking = data.bookings.find(b => {
            const bookingCode = normalizeCode(b['REF CODE'] || '');
            return bookingCode === searchCode;
          });
          
          if (booking) {
            bookingData = booking;
            populateBookingDetails(booking);
          } else {
            hideBookingDetails();
            showError('Booking not found. Please check your reference code.');
          }
        } else {
          showError('Error loading bookings.');
        }
      } catch (error) {
        console.error('Error:', error);
        showError('Network error. Please try again.');
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function populateBookingDetails(booking) {
      // Format dates
      let displayDate = booking.DATE;
      let displayTime = booking.TIME;
      
      if (booking.DATE && booking.DATE.includes('T')) {
        displayDate = new Date(booking.DATE).toLocaleDateString();
      }
      if (booking.TIME && booking.TIME.includes('T')) {
        displayTime = new Date(booking.TIME).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      }

      // Fill in fields
      document.getElementById('clientName').value = booking.NAME || '';
      document.getElementById('clientPhone').value = booking.PHONE || '';
      document.getElementById('bookDate').value = displayDate;
      document.getElementById('bookTime').value = displayTime;
      document.getElementById('pickupAddress').value = booking['PICK UP'] || '';
      document.getElementById('dropoffAddress').value = booking['DROP OFF'] || '';
      document.getElementById('finalPrice').textContent = '$' + (booking['FINAL PRICE'] || '0.00') + ' TTD';

      // Show sections
      document.getElementById('bookingDetails').classList.remove('hidden');
      document.getElementById('paymentSection').classList.remove('hidden');
      document.getElementById('confirmBtn').disabled = false;
    }

    function hideBookingDetails() {
      document.getElementById('bookingDetails').classList.add('hidden');
      document.getElementById('paymentSection').classList.add('hidden');
      document.getElementById('confirmBtn').disabled = true;
      bookingData = null;
    }

    function showError(message) {
      document.getElementById('errorText').textContent = message;
      document.getElementById('errorMessage').classList.remove('hidden');
      setTimeout(() => {
        document.getElementById('errorMessage').classList.add('hidden');
      }, 5000);
    }

    // Form submission
    document.getElementById('confirmForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      if (!bookingData) {
        showError('Please enter a valid reference code.');
        return;
      }

      const paymentMethod = document.getElementById('paymentMethod').value;
      if (!paymentMethod) {
        showError('Please select a payment method.');
        return;
      }

      const confirmBtn = document.getElementById('confirmBtn');
      confirmBtn.disabled = true;
      confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Confirming...';

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: new URLSearchParams({
            action: 'updateStatus',
            row: bookingData._rowNumber,
            status: 'Confirmed'
          })
        });

        const result = await response.json();
        
        if (result.success) {
          // Show success message
          document.getElementById('confirmForm').innerHTML = `
            <div class="text-center py-8">
              <div class="text-green-500 text-6xl mb-4"><i class="fas fa-check-circle"></i></div>
              <h2 class="text-2xl font-bold text-gray-800 mb-4">Booking Confirmed!</h2>
              <p class="text-gray-600 mb-4">Thank you for confirming your reservation.</p>
              <p class="text-gray-600">Reference: <strong>${bookingData['REF CODE']}</strong></p>
              <p class="text-gray-600 mt-4">We look forward to serving you!</p>
            </div>
          `;
        } else {
          showError('Error confirming booking. Please try again.');
          confirmBtn.disabled = false;
          confirmBtn.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Confirm Booking';
        }
      } catch (error) {
        showError('Network error. Please try again.');
        confirmBtn.disabled = false;
        confirmBtn.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Confirm Booking';
      }
    });
  </script>
</body>
</html>
