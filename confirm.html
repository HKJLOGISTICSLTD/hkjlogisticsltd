<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Booking - HKJ Logistics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.6s ease;
    }
  </style>
</head>
<body class="py-12 px-4">

  <div class="max-w-3xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-8 animate-fade-in">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-yellow-400 to-yellow-500 rounded-full mb-4 shadow-lg">
        <i class="fas fa-truck text-black text-3xl"></i>
      </div>
      <h1 class="text-4xl font-bold text-gray-800 mb-2">
        HKJ <span class="text-yellow-500">Logistics</span>
      </h1>
      <p class="text-gray-600">Booking Confirmation</p>
    </div>

    <!-- Loading State -->
    <div id="loadingState" class="glass-card rounded-3xl p-12 text-center animate-fade-in">
      <div class="inline-block animate-spin rounded-full h-16 w-16 border-4 border-yellow-400 border-t-transparent mb-4"></div>
      <p class="text-gray-600 text-lg">Loading your booking details...</p>
    </div>

    <!-- Error State -->
    <div id="errorState" class="hidden glass-card rounded-3xl p-12 text-center animate-fade-in">
      <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-exclamation-triangle text-red-500 text-4xl"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-800 mb-2">Booking Not Found</h2>
      <p class="text-gray-600 mb-6">We couldn't find a booking with that reference code.</p>
      <a href="https://hkjlogisticsltdtt.vercel.app" 
         class="inline-block bg-gradient-to-r from-yellow-400 to-yellow-500 hover:from-yellow-500 hover:to-yellow-600 text-black font-bold py-3 px-8 rounded-xl transition shadow-lg">
        <i class="fas fa-home mr-2"></i> Return to Home
      </a>
    </div>

    <!-- Success State - Booking Details -->
    <div id="bookingDetails" class="hidden animate-fade-in">
      <div class="glass-card rounded-3xl p-8 md:p-12 mb-6">
        <div class="flex items-center justify-between mb-8 pb-6 border-b-2 border-gray-100">
          <div>
            <h2 class="text-3xl font-bold text-gray-800 mb-1">Booking Found!</h2>
            <p class="text-gray-600">Reference: <span id="displayRefCode" class="font-bold text-purple-600"></span></p>
          </div>
          <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center">
            <i class="fas fa-check-circle text-green-600 text-3xl"></i>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
          <div class="bg-gray-50 p-4 rounded-xl">
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Client Name</label>
            <p id="displayName" class="text-lg font-semibold text-gray-800"></p>
          </div>
          <div class="bg-gray-50 p-4 rounded-xl">
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Phone</label>
            <p id="displayPhone" class="text-lg font-semibold text-gray-800"></p>
          </div>
          <div class="bg-gray-50 p-4 rounded-xl">
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Date</label>
            <p id="displayDate" class="text-lg font-semibold text-gray-800"></p>
          </div>
          <div class="bg-gray-50 p-4 rounded-xl">
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Time</label>
            <p id="displayTime" class="text-lg font-semibold text-gray-800"></p>
          </div>
        </div>

        <div class="mb-8">
          <div class="bg-green-50 p-4 rounded-xl mb-4 border-l-4 border-green-500">
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Pickup Address</label>
            <p id="displayPickup" class="text-lg font-semibold text-gray-800"></p>
          </div>
          <div class="bg-red-50 p-4 rounded-xl border-l-4 border-red-500">
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Drop-off Address</label>
            <p id="displayDropoff" class="text-lg font-semibold text-gray-800"></p>
          </div>
        </div>

        <!-- Price Display -->
        <div class="bg-gradient-to-r from-yellow-50 to-orange-50 p-6 rounded-2xl border-2 border-yellow-300 mb-8">
          <label class="block text-xs font-bold text-gray-600 uppercase mb-2">Final Price</label>
          <p id="displayPrice" class="text-4xl font-bold text-gray-800"></p>
          <p class="text-sm text-gray-600 mt-2">
            <i class="fas fa-info-circle mr-1"></i> This is the confirmed price for your trip
          </p>
        </div>

        <!-- Payment Method -->
        <div class="mb-8">
          <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Preferred Payment Method</label>
          <select id="paymentMethod" class="w-full p-4 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-purple-500 bg-white">
            <option value="">Select payment method...</option>
            <option value="Credit Card / Linx">Credit Card / Linx</option>
            <option value="Online (WiPay)">Online (WiPay)</option>
            <option value="Cash">Cash</option>
            <option value="Online Transfer">Online Transfer</option>
          </select>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <button onclick="confirmBooking()" 
            class="bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold py-4 px-8 rounded-xl transition shadow-lg flex items-center justify-center text-lg">
            <i class="fas fa-check-circle mr-3 text-2xl"></i>
            <div>
              <div class="font-bold">CONFIRM BOOKING</div>
              <div class="text-xs opacity-90">Accept and finalize</div>
            </div>
          </button>
          
          <button onclick="declineBooking()" 
            class="bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white font-bold py-4 px-8 rounded-xl transition shadow-lg flex items-center justify-center text-lg">
            <i class="fas fa-times-circle mr-3 text-2xl"></i>
            <div>
              <div class="font-bold">DECLINE</div>
              <div class="text-xs opacity-90">Cancel this booking</div>
            </div>
          </button>
        </div>
      </div>

      <!-- Contact Info -->
      <div class="glass-card rounded-2xl p-6 text-center">
        <p class="text-gray-600 mb-2">Need help or have questions?</p>
        <p class="font-bold text-gray-800">
          <i class="fas fa-phone mr-2 text-yellow-500"></i>+1 (868) 780-0300
        </p>
        <p class="text-sm text-gray-500 mt-2">We're available 24/7</p>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚠️ REPLACE WITH YOUR APPS SCRIPT URL
    // ==========================================
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw1Fji0W9KckebjpfTcMLLtRNdf8fVMT_yQ_3PPrwg6kBZxsK8C-12TB-bAeCLY2ckwcg/exec';

    // Get reference code from URL
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get('code');

    let currentBooking = null;

    // Load booking details
    async function loadBooking() {
      if (!refCode) {
        showError();
        return;
      }

      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();

        if (data.success) {
          const booking = data.bookings.find(b => b['REF CODE'] === refCode);
          
          if (booking) {
            currentBooking = booking;
            displayBooking(booking);
          } else {
            showError();
          }
        } else {
          showError();
        }
      } catch (error) {
        console.error('Error:', error);
        showError();
      }
    }

    function displayBooking(booking) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.add('hidden');
      document.getElementById('bookingDetails').classList.remove('hidden');

      document.getElementById('displayRefCode').textContent = booking['REF CODE'];
      document.getElementById('displayName').textContent = booking.NAME || 'N/A';
      document.getElementById('displayPhone').textContent = booking.PHONE || 'N/A';
      
      // Format date
      let dateStr = booking.DATE;
      if (dateStr && dateStr.includes('T')) {
        const dateObj = new Date(dateStr);
        dateStr = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      }
      document.getElementById('displayDate').textContent = dateStr || 'N/A';
      
      // Format time
      let timeStr = booking.TIME;
      if (timeStr && timeStr.includes('T')) {
        const timeObj = new Date(timeStr);
        timeStr = timeObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      }
      document.getElementById('displayTime').textContent = timeStr || 'N/A';
      
      document.getElementById('displayPickup').textContent = booking['PICK UP'] || 'N/A';
      document.getElementById('displayDropoff').textContent = booking['DROP OFF'] || 'N/A';
      
      // Display price from Column K
      const price = booking['FINAL PRICE'] || '0';
      document.getElementById('displayPrice').textContent = `$${price} TTD`;
      
      // Set payment method from booking if available
      if (booking['PAYMENT METHOD']) {
        document.getElementById('paymentMethod').value = booking['PAYMENT METHOD'];
      }
    }

    function showError() {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
    }

    async function confirmBooking() {
      if (!currentBooking) return;
      
      const paymentMethod = document.getElementById('paymentMethod').value;
      if (!paymentMethod) {
        alert('Please select a payment method.');
        return;
      }

      if (!confirm('Are you sure you want to confirm this booking?')) return;

      const btn = event.target.closest('button');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-3"></i> Processing...';
      btn.disabled = true;

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: new URLSearchParams({
            action: 'updateStatus',
            row: currentBooking._rowNumber,
            status: 'Confirmed',
            paymentMethod: paymentMethod
          })
        });

        const result = await response.json();
        
        if (result.success) {
          alert('✅ Booking confirmed successfully! We look forward to serving you.');
          location.reload();
        } else {
          alert('Error confirming booking. Please try again.');
          btn.innerHTML = originalHTML;
          btn.disabled = false;
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please try again.');
        btn.innerHTML = originalHTML;
        btn.disabled = false;
      }
    }

    async function declineBooking() {
      if (!currentBooking) return;
      
      if (!confirm('Are you sure you want to decline this booking?')) return;

      const btn = event.target.closest('button');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-3"></i> Processing...';
      btn.disabled = true;

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: new URLSearchParams({
            action: 'updateStatus',
            row: currentBooking._rowNumber,
            status: 'Cancelled'
          })
        });

        const result = await response.json();
        
        if (result.success) {
          alert('Booking has been cancelled.');
          window.location.href = 'https://hkjlogisticsltdtt.vercel.app';
        } else {
          alert('Error declining booking. Please try again.');
          btn.innerHTML = originalHTML;
          btn.disabled = false;
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please try again.');
        btn.innerHTML = originalHTML;
        btn.disabled = false;
      }
    }

    // Load on page load
    window.addEventListener('DOMContentLoaded', loadBooking);
  </script>
</body>
</html>
