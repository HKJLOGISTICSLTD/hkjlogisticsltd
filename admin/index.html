<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HKJ Logistics Admin Dashboard</title>
  <!-- Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .status-pending { @apply bg-yellow-100 text-yellow-800; }
    .status-pricesent { @apply bg-orange-100 text-orange-800; }
    .status-confirmed { @apply bg-green-100 text-green-800; }
    .status-completed { @apply bg-blue-100 text-blue-800; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen p-6">

  <div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">🚗 HKJ Logistics Admin</h1>
      <button onclick="loadBookings()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow transition">
        <i class="fas fa-sync-alt mr-2"></i> Refresh
      </button>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="hidden text-center py-12">
      <i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i>
      <p class="mt-4 text-gray-600">Loading bookings...</p>
    </div>

    <!-- Bookings Container -->
    <div id="bookings-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Bookings will be injected here by JavaScript -->
    </div>
  </div>

  <script>
    // ==========================================
    // ⚠️ REPLACE THIS WITH YOUR ACTUAL APPS SCRIPT WEB APP URL
    // ==========================================
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx6xDIYPUdE0Vxl3ndy1axkjX0Y6MWYYNRJ7tla1o-nUUPEMpcssfucjxL3qZIXnHdj/exec';

    // Load bookings on page load
    document.addEventListener('DOMContentLoaded', loadBookings);

    function loadBookings() {
      const container = document.getElementById('bookings-container');
      const loading = document.getElementById('loading');
      
      container.innerHTML = '';
      loading.classList.remove('hidden');

      fetch(APPS_SCRIPT_URL)
        .then(response => response.json())
        .then(data => {
          loading.classList.add('hidden');
          if (data.success && data.bookings.length > 0) {
            // Sort by date descending (newest first)
            const sortedBookings = data.bookings.sort((a, b) => new Date(b.DATE) - new Date(a.DATE));
            sortedBookings.forEach(booking => renderBookingCard(booking));
          } else {
            container.innerHTML = '<p class="text-gray-500 col-span-full text-center">No bookings found.</p>';
          }
        })
        .catch(error => {
          loading.classList.add('hidden');
          console.error('Error:', error);
          container.innerHTML = '<p class="text-red-500 col-span-full text-center">Error loading bookings. Check console.</p>';
        });
    }

    function renderBookingCard(booking) {
      const container = document.getElementById('bookings-container');
      
      // Determine status badge color
      const statusClass = {
        'Pending': 'status-pending',
        'Price Sent': 'status-pricesent',
        'Confirmed': 'status-confirmed',
        'Completed': 'status-completed'
      }[booking.STATUS] || 'bg-gray-100 text-gray-800';

      const card = document.createElement('div');
      card.className = 'bg-white rounded-xl shadow-md p-6 border border-gray-100 hover:shadow-lg transition';
      
      card.innerHTML = `
        <div class="flex justify-between items-start mb-4">
          <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide ${statusClass}">
            ${booking.STATUS || 'Pending'}
          </span>
          <span class="text-sm text-gray-500 font-mono">${booking['REF CODE'] || 'N/A'}</span>
        </div>
        
        <h3 class="text-xl font-bold text-gray-800 mb-2">${booking.NAME || 'Unknown Client'}</h3>
        
        <div class="space-y-2 text-sm text-gray-600 mb-4">
          <p><i class="fas fa-calendar-alt w-5 text-gray-400"></i> ${booking.DATE || 'N/A'} at ${booking.TIME || 'N/A'}</p>
          <p><i class="fas fa-map-marker-alt w-5 text-gray-400"></i> <strong>From:</strong> ${booking['PICK UP'] || 'N/A'}</p>
          <p><i class="fas fa-flag-checkered w-5 text-gray-400"></i> <strong>To:</strong> ${booking['DROP OFF'] || 'N/A'}</p>
          <p><i class="fas fa-phone w-5 text-gray-400"></i> ${booking.PHONE || 'No Phone'}</p>
          <p><i class="fas fa-envelope w-5 text-gray-400"></i> ${booking.EMAIL || 'No Email'}</p>
          <p class="text-lg font-bold text-red-600 mt-2">
            <i class="fas fa-dollar-sign w-5"></i> Final Price: $${booking['FINAL PRICE'] || '0.00'} TTD
          </p>
        </div>

        <div class="border-t pt-4 mt-4 grid grid-cols-2 gap-2">
          <button onclick="updatePrice(${booking._rowNumber})" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2 rounded text-sm font-semibold transition">
            <i class="fas fa-calculator mr-1"></i> Calc/Update Price
          </button>
          
          <button onclick="confirmBooking(${booking._rowNumber})" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded text-sm font-semibold transition">
            <i class="fas fa-check mr-1"></i> Confirm
          </button>
          
          <button onclick="markAsCompleted(${booking._rowNumber})" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded text-sm font-semibold transition col-span-2">
            <i class="fas fa-check-circle mr-1"></i> Mark as Completed
          </button>
          
          <button onclick="resetStatus(${booking._rowNumber})" class="bg-gray-500 hover:bg-gray-600 text-white px-3 py-2 rounded text-sm font-semibold transition col-span-2">
            <i class="fas fa-undo mr-1"></i> Reset to Pending
          </button>
        </div>
      `;
      
      container.appendChild(card);
    }

    // ==========================================
    // ACTION FUNCTIONS
    // ==========================================

    function updatePrice(rowNumber) {
      const newPrice = prompt('Enter the new final price (e.g., 250):');
      if (!newPrice) return;

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'updatePrice',
          row: rowNumber,
          price: newPrice
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('✅ Price updated and status set to "Price Sent"!');
          loadBookings();
        } else {
          alert('❌ Error updating price.');
        }
      })
      .catch(err => {
        console.error(err);
        alert('❌ Network error.');
      });
    }

    function confirmBooking(rowNumber) {
      if (!confirm('Mark this booking as Confirmed?')) return;
      
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'updateStatus',
          row: rowNumber,
          status: 'Confirmed'
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('✅ Booking Confirmed!');
          loadBookings();
        } else {
          alert('❌ Error confirming booking.');
        }
      })
      .catch(err => {
        console.error(err);
        alert('❌ Network error.');
      });
    }

    // 🆕 NEW: Mark as Completed Function
    function markAsCompleted(rowNumber) {
      if (!confirm('Mark this booking as Completed? This cannot be undone easily.')) return;
      
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'updateStatus',
          row: rowNumber,
          status: 'Completed'
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('✅ Booking marked as Completed!');
          loadBookings(); // Refresh the list to show the blue "Completed" badge
        } else {
          alert('❌ Error updating status.');
        }
      })
      .catch(err => {
        console.error(err);
        alert('❌ Network error.');
      });
    }

    function resetStatus(rowNumber) {
      if (!confirm('Reset this booking status to Pending?')) return;
      
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'updateStatus',
          row: rowNumber,
          status: 'Pending'
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('🔄 Status reset to Pending!');
          loadBookings();
        } else {
          alert('❌ Error resetting status.');
        }
      })
      .catch(err => {
        console.error(err);
        alert('❌ Network error.');
      });
    }
  </script>
</body>
</html>
