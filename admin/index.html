    function checkPassword() {
      const input = document.getElementById('passwordInput').value;
      if (input === ADMIN_PASSWORD) {
        sessionStorage.setItem('hkjAdminLoggedIn', 'true');
        showDashboard();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
      }

    function showDashboard() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('adminDashboard').classList.remove('hidden');
      fetchBookings();
    }

    function logout() {
      sessionStorage.removeItem('hkjAdminLoggedIn');
      location.reload();

    // Currency conversion: 1 USD = 6.80 TTD (ROUNDED to nearest whole dollar)
    function convertTTDtoUSD(ttdAmount) {
      return Math.round(parseFloat(ttdAmount) / 6.80);
    }

    // Surcharge calculation
    function calculateSurcharge(basePrice, surchargeType) {
      if (!surchargeType || surchargeType === 'none') return 0;
      
      const base = parseFloat(basePrice) || 0;
      switch(surchargeType) {
        case 'peak': return 50;
        case 'lateNight': return Math.round(base * 0.15);
        case 'earlyMorning': return Math.round(base * 0.20);
        case 'holiday': return Math.round(base * 0.25);
        default: return 0;
      }
    }

    function getSurchargeLabel(surchargeType) {
      switch(surchargeType) {
        case 'peak': return 'Peak Hours (6-9 AM): +$50 TTD';
        case 'lateNight': return 'Late Night (10 PM-12 AM): +15%';
        case 'earlyMorning': return 'Early Morning (12-6 AM): +20%';
        case 'holiday': return 'Public Holiday: +25%';
        default: return '';
      }
    }

    function autoSavePrice(row, price) {
      if (saveTimeout) {
        clearTimeout(saveTimeout);
      }
      
      const priceInput = document.getElementById(`price-${row}`);
      if (priceInput) {
        priceInput.style.borderColor = '#fbbf24';
      }
      
      saveTimeout = setTimeout(() => {
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: new URLSearchParams({
            action: 'updatePrice',
            row: row,
            price: price
          })
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            if (priceInput) {
              priceInput.style.borderColor = '#10b981';
              setTimeout(() => {
                priceInput.style.borderColor = '#e5e7eb';
              }, 2000);
            }
            console.log('Price saved:', price);
          }
        })
        .catch(error => {
          console.error('Error saving price:', error);
          if (priceInput) {
            priceInput.style.borderColor = '#ef4444';
          }
        });
      }, 1000);
    }

    // NEW: Update surcharge locally first, then save to server
    function updateSurcharge(row) {
      const surchargeSelect = document.getElementById(`surcharge-${row}`);
      const surchargeType = surchargeSelect.value;
      
      // Get current price
      const priceInput = document.getElementById(`price-${row}`);
      const price = parseFloat(priceInput.value) || 0;
      
      // Calculate surcharge locally
      const surchargeAmount = calculateSurcharge(price, surchargeType);
      const totalPrice = price + surchargeAmount;
      const totalUSD = convertTTDtoUSD(totalPrice);
      
      // Update the display immediately
      const surchargeDisplay = document.getElementById(`surchargeDisplay-${row}`);
      const totalDisplay = document.getElementById(`totalDisplay-${row}`);
      
      if (surchargeAmount > 0) {
        if (surchargeDisplay) {
          surchargeDisplay.innerHTML = `
            <div class="surcharge-display p-3 rounded-lg mt-2 text-center">
              <p class="text-sm text-orange-600 mb-1">Surcharge Applied</p>
              <p class="text-lg font-bold text-orange-700">+$${surchargeAmount} TTD (${getSurchargeLabel(surchargeType)})</p>
            </div>
            <div class="bg-gradient-to-r from-green-100 to-emerald-100 p-3 rounded-lg mt-2 text-center border-2 border-green-300">
              <p class="text-sm text-green-700 mb-1 font-bold">TOTAL FINAL PRICE</p>
              <p class="text-2xl font-bold text-green-800">$${totalPrice.toFixed(2)} TTD ($${totalUSD} USD)</p>
            </div>
          `;
        }
      } else {
        if (surchargeDisplay) {
          surchargeDisplay.innerHTML = '';
        }
      }
      
      // Save to server in background (don't refresh page)
      if (surchargeSaveTimeout) {
        clearTimeout(surchargeSaveTimeout);
      }
      
      surchargeSaveTimeout = setTimeout(() => {
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: new URLSearchParams({
            action: 'updateSurcharge',
            row: row,
            surcharge: surchargeType
          })
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            console.log('Surcharge saved:', surchargeType);
            // Show brief success indicator
            surchargeSelect.style.borderColor = '#10b981';
            setTimeout(() => {
              surchargeSelect.style.borderColor = '#fdba74';
            }, 2000);
          }
        })
        .catch(error => {
          console.error('Error saving surcharge:', error);
          surchargeSelect.style.borderColor = '#ef4444';
        });
      }, 500);
    }

    function getPresetPrice(pickup, dropoff) {
      const p = pickup.toLowerCase();
      const d = dropoff.toLowerCase();
      
      for (let key in PRESET_ROUTES) {
        const [from, to] = key.split('-');
        if ((p.includes(from) && d.includes(to)) || (p.includes(to) && d.includes(from))) {
          return PRESET_ROUTES[key];
        }
      }
      return null;
    }

    async function calculateRealPrice(row) {
      const btn = document.getElementById(`autoBtn-${row}`);
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Calculating...';
      btn.disabled = true;

      const booking = allBookings.find(b => b._rowNumber === row);
      if (!booking) { btn.innerHTML = originalText; btn.disabled = false; return; }

      const pickup = booking['PICK UP'];
      const dropoff = booking['DROP OFF'];

      const fullText = (pickup + ' ' + dropoff).toLowerCase();
      
      if (fullText.includes('tobago') || fullText.includes('scarborough')) {
        applyAutoPrice(row, 500);
        btn.innerHTML = '<i class="fas fa-check mr-1"></i>AUTO $500 (Tobago)';
        btn.disabled = false;
        return;
      }

      const preset = getPresetPrice(pickup, dropoff);
      if (preset) {
        applyAutoPrice(row, preset.price);
        btn.innerHTML = `<i class="fas fa-check mr-1"></i>AUTO $${preset.price} (${preset.km}km)`;
        btn.disabled = false;
        return;
      }

      alert('Could not calculate route.\n\nPlease enter price manually or use Quick Price buttons.');
      btn.innerHTML = originalText;
      btn.disabled = false;
    }

    async function fetchBookings() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('bookingsGrid').classList.add('hidden');

      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();

        if (data.success) {
          allBookings = data.bookings;
          renderBookings(data.bookings);
        } else {
          alert('Error loading bookings.');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please check your Apps Script URL and try again.');
      } finally {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('bookingsGrid').classList.remove('hidden');
      }
    }

    function openEditModal(row, booking) {
      document.getElementById('editRowNumber').value = row;
      document.getElementById('editRefCode').value = booking['REF CODE'] || '';
      document.getElementById('editStatus').value = booking.STATUS || 'Pending';
      document.getElementById('editName').value = booking.NAME || '';
      document.getElementById('editPhone').value = booking.PHONE || '';
      document.getElementById('editEmail').value = booking.EMAIL || '';
      
      let dateStr = booking.DATE || '';
      if (dateStr && dateStr.includes('T')) {
        dateStr = dateStr.split('T')[0];
      }
      document.getElementById('editDate').value = dateStr;
      
      let timeStr = booking.TIME || '';
      if (timeStr && timeStr.includes('T')) {
        const timeParts = timeStr.split('T')[1];
        timeStr = timeParts ? timeParts.substring(0, 5) : '';
      }
      document.getElementById('editTime').value = timeStr;
      
      document.getElementById('editPickup').value = booking['PICK UP'] || '';
      document.getElementById('editDropoff').value = booking['DROP OFF'] || '';
      document.getElementById('editVehicle').value = booking['VEHICLE TYPE'] || '';
      document.getElementById('editService').value = booking['SERVICE TYPE'] || '';
      document.getElementById('editPrice').value = booking['FINAL PRICE'] || booking['FARES'] || '';
      document.getElementById('editPayment').value = booking['PAYMENT METHOD'] || '';
      document.getElementById('editNotes').value = booking.NOTES || '';
      
      document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('active');
    }

    document.getElementById('editForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const row = document.getElementById('editRowNumber').value;
      const formData = {
        action: 'updateBooking',
        row: row,
        refCode: document.getElementById('editRefCode').value,
        status: document.getElementById('editStatus').value,
        name: document.getElementById('editName').value,
        phone: document.getElementById('editPhone').value,
        email: document.getElementById('editEmail').value,
        date: document.getElementById('editDate').value,
        time: document.getElementById('editTime').value,
        pickup: document.getElementById('editPickup').value,
        dropoff: document.getElementById('editDropoff').value,
        vehicle: document.getElementById('editVehicle').value,
        service: document.getElementById('editService').value,
        price: document.getElementById('editPrice').value,
        payment: document.getElementById('editPayment').value,
        notes: document.getElementById('editNotes').value
      };
      
      const btn = e.target.querySelector('button[type="submit"]');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Saving...';
      btn.disabled = true;
      
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: new URLSearchParams(formData)
        });
        
        const result = await response.json();
        
        if (result.success) {
          alert('✅ Booking updated successfully!');
          closeEditModal();
          fetchBookings();
        } else {
          alert('Error updating booking.');
        }
      } catch (error) {
        alert('Network error.');
      } finally {
        btn.innerHTML = originalHTML;
        btn.disabled = false;
      }
    });

    function applyAutoPrice(row, price) {
      const input = document.getElementById(`price-${row}`);
      input.value = price;
      input.classList.add('price-flash');
      setTimeout(() => {
        input.classList.remove('price-flash');
      }, 1000);
      autoSavePrice(row, price);
    }

    function togglePriceDropdown(row) {
      event.stopPropagation();
      const dropdown = document.getElementById(`priceDropdown-${row}`);
      document.querySelectorAll('.price-dropdown-content').forEach(d => {
        if (d !== dropdown) d.classList.remove('show');
      });
      dropdown.classList.toggle('show');
    }

    function setQuickPrice(row, price) {
      const input = document.getElementById(`price-${row}`);
      input.value = price;
      input.classList.add('price-flash');
      setTimeout(() => {
        input.classList.remove('price-flash');
      }, 1000);
      const dropdown = document.getElementById(`priceDropdown-${row}`);
      dropdown.classList.remove('show');
      autoSavePrice(row, price);
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.price-dropdown')) {
        document.querySelectorAll('.price-dropdown-content').forEach(dropdown => {
          dropdown.classList.remove('show');
        });
      }
    });

    function formatDate(dateString) {
      if (!dateString) return 'N/A';
      try {
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      } catch (e) {
        return dateString;
      }
    }

    function formatTime(timeString) {
      if (!timeString) return 'N/A';
      try {
        const time = new Date(timeString);
        return time.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        return timeString;
      }
    }

    async function sendPriceEmail(row) {
      const price = document.getElementById(`price-${row}`).value;
      if (!price || price === '0' || price === '0.00') {
        alert('Please enter a valid price first.');
        return;
      }

      const btn = event.target.closest('button');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
      btn.disabled = true;

      try {
        console.log('Sending price email for row:', row, 'price:', price);
        
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: new URLSearchParams({
            action: 'sendPriceEmail',
            row: row,
            price: price
          })
        });
        
        const result = await response.json();
        console.log('Email response:', result);
        
        if (result.success) {
          alert('✅ Price email sent successfully!');
          fetchBookings();
        } else {
          alert('❌ Error sending email: ' + (result.message || 'Unknown error'));
        }
      } catch (error) {
        console.error('Error:', error);
        alert('❌ Network error. Please try again.');
      } finally {
        btn.innerHTML = originalHTML;
        btn.disabled = false;
      }
    }

    async function sendWhatsApp(row) {
      const price = document.getElementById(`price-${row}`).value;
      if (!price || price === '0' || price === '0.00') {
        alert('Please enter a valid price first.');
        return;
      }

      const btn = event.target.closest('button');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Preparing...';
      btn.disabled = true;

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: new URLSearchParams({
            action: 'updatePrice',
            row: row,
            price: price
          })
        });

        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();
        const booking = data.bookings.find(b => b._rowNumber === row);
        
        if (booking) {
          let phone = booking.PHONE || '';
          const refCode = booking['REF CODE'] || '';
          const clientName = booking.NAME || '';
          const pickup = booking['PICK UP'] || '';
          const dropoff = booking['DROP OFF'] || '';
          const date = formatDate(booking.DATE);
          const time = formatTime(booking.TIME);
          const surchargeType = booking['SURCHARGE'] || 'none';
          const surchargeAmount = calculateSurcharge(price, surchargeType);
          const totalPrice = parseFloat(price) + surchargeAmount;
          const usdPrice = convertTTDtoUSD(price);
          const totalUSD = convertTTDtoUSD(totalPrice);
          
          phone = phone.toString().replace(/\D/g, '');
          if (!phone.startsWith('1')) {
            phone = '1' + phone;
          }
          
          let message = `Hello ${clientName},\n\n`;
          message += `Your HKJ Logistics booking ${refCode} is ready for review!\n\n`;
          message += `📅 Date: ${date} at ${time}\n`;
          message += `📍 Pickup: ${pickup}\n`;
          message += `🏁 Drop-off: ${dropoff}\n`;
          message += `💰 Base Price: $${price} TTD ($${usdPrice} USD)\n`;
          
          if (surchargeAmount > 0) {
            message += `⚠️ Surcharge: +$${surchargeAmount} TTD (${getSurchargeLabel(surchargeType)})\n`;
            message += ` TOTAL: $${totalPrice.toFixed(2)} TTD ($${totalUSD} USD)\n`;
          } else {
            message += `💵 TOTAL: $${totalPrice.toFixed(2)} TTD ($${totalUSD} USD)\n`;
          }
          
          message += `\n📋 HOW IT WORKS:\n`;
          message += `1. We received your request. ✓\n`;
          message += `2. This is your personalized quote. ✓\n`;
          message += `3. Click the link below to CONFIRM or DECLINE your booking.\n\n`;
          message += ` Confirm or Decline here:\n`;
          message += `https://hkjlogisticsltdtt.vercel.app/confirm.html?code=${refCode}\n\n`;
          message += `Thank you,\nHayden Joseph\nManaging Director, HKJ Logistics Ltd\n+1 (868) 780-0300`;
          
          const encodedMessage = encodeURIComponent(message);
          const whatsappUrl = `https://wa.me/${phone}?text=${encodedMessage}`;
          
          const newWindow = window.open(whatsappUrl, '_blank');
          
          if (!newWindow || newWindow.closed || typeof newWindow.closed == 'undefined') {
            alert('⚠️ WhatsApp popup was blocked!');
          } else {
            setTimeout(() => {
              alert('✅ WhatsApp opened! Client can now confirm or decline.');
            }, 1000);
          }
          
          await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            body: new URLSearchParams({
              action: 'updateStatus',
              row: row,
              status: 'Price Sent'
            })
          });
          
          fetchBookings();
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Error preparing WhatsApp message.');
      } finally {
        btn.innerHTML = originalHTML;
        btn.disabled = false;
      }
    }

    async function updateStatus(row, status) {
      const originalText = event.target.innerHTML;
      event.target.disabled = true;

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: new URLSearchParams({
            action: 'updateStatus',
            row: row,
            status: status
          })
        });
        const result = await response.json();
        if (result.success) {
          fetchBookings();
        } else {
          alert('Error updating status.');
        }
      } catch (error) {
        alert('Network error.');
      } finally {
        event.target.disabled = false;
      }
    }

    async function generateReport() {
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();
        
        if (data.success) {
          const bookings = data.bookings;
          
          let pending = 0, confirmed = 0, completed = 0, cancelled = 0, priceSent = 0;
          let totalRevenue = 0;
          
          bookings.forEach(b => {
            const status = b.STATUS || 'Pending';
            const price = parseFloat(b['FINAL PRICE'] || b['FARES']) || 0;
            const surchargeType = b['SURCHARGE'] || 'none';
            const surchargeAmount = calculateSurcharge(price, surchargeType);
            const totalPrice = price + surchargeAmount;
            
            if (status === 'Pending') pending++;
            else if (status === 'Price Sent') priceSent++;
            else if (status === 'Confirmed') confirmed++;
            else if (status === 'Completed') completed++;
            else if (status === 'Cancelled') cancelled++;
            
            if (totalPrice && ['Completed', 'Confirmed', 'Price Sent'].includes(status)) {
              totalRevenue += totalPrice;
            }
          });
          
          const totalUSD = Math.round(totalRevenue / 6.80);
          
          const report = `📊 HKJ Logistics Report\n\n` +
            `📈 BOOKING STATUS:\n` +
            `─────────────────\n` +
            `Total Bookings: ${bookings.length}\n` +
            `⏳ Pending: ${pending}\n` +
            `💰 Price Sent: ${priceSent}\n` +
            `✅ Confirmed: ${confirmed}\n` +
            `✔️ Completed: ${completed}\n` +
            `❌ Cancelled: ${cancelled}\n\n` +
            `💵 TOTAL REVENUE (with surcharges):\n` +
            `   $${totalRevenue.toFixed(2)} TTD\n` +
            `   $${totalUSD} USD (rounded)\n` +
            `─────────────────\n` +
            `Exchange Rate: 1 USD = 6.80 TTD\n` +
            `Generated: ${new Date().toLocaleString()}`;
          
          alert(report);
        }
      } catch (error) {
        alert('Error generating report.');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Login screen is shown by default
    });
  </script>
