<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HKJ Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Open Sans', sans-serif; background: #f5f5f5; color: #333; }
.header { background: #000; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #FFD700; }
.header h1 { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 2rem; color: #fff; }
.header h1 span { color: #FFD700; }
.header-buttons { display: flex; gap: 1rem; }
.btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-weight: 700; cursor: pointer; transition: all 0.3s; font-size: 0.95rem; display: flex; align-items: center; gap: 0.5rem; }
.btn-refresh { background: #FFD700; color: #000; }
.btn-refresh:hover { background: #FFC107; transform: translateY(-2px); }
.btn-logout { background: #DC2626; color: #fff; }
.btn-logout:hover { background: #B91C1C; }
.container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
.stat-card { background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-left: 5px solid #FFD700; }
.stat-card h3 { font-family: 'Montserrat', sans-serif; font-size: 0.85rem; color: #666; font-weight: 700; text-transform: uppercase; margin-bottom: 0.5rem; }
.stat-card .value { font-family: 'Montserrat', sans-serif; font-size: 2.5rem; font-weight: 900; color: #000; }
.stat-card.revenue { border-left-color: #25D366; }
.stat-card.pending { border-left-color: #DC2626; }
.bookings-section { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
.section-header h2 { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.5rem; }
.filter-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.filter-btn { padding: 0.5rem 1rem; border: 2px solid #e0e0e0; background: #fff; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.3s; }
.filter-btn.active { background: #FFD700; border-color: #FFD700; color: #000; }
.filter-btn:hover { border-color: #FFD700; }
.booking-card { background: #f9f9f9; border: 2px solid #e0e0e0; border-radius: 10px; padding: 1.5rem; margin-bottom: 1rem; transition: all 0.3s; }
.booking-card:hover { border-color: #FFD700; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
.booking-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
.booking-ref { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1.3rem; color: #000; }
.status-badge { padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
.status-pending { background: #FEF3C7; color: #92400E; }
.status-price-sent { background: #DBEAFE; color: #1E40AF; }
.status-confirmed { background: #D1FAE5; color: #065F46; }
.status-completed { background: #E0E7FF; color: #3730A3; }
.booking-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
.detail-item { font-size: 0.9rem; }
.detail-item strong { color: #666; font-size: 0.75rem; text-transform: uppercase; display: block; margin-bottom: 0.25rem; }
.detail-item span { font-weight: 600; color: #000; }
.price-display { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1.5rem; color: #DC2626; }
.booking-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e0e0e0; }
.action-btn { padding: 0.6rem 1rem; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.85rem; transition: all 0.3s; display: flex; align-items: center; gap: 0.4rem; }
.action-btn:hover { transform: translateY(-2px); }
.btn-calc { background: #0066CC; color: #fff; }
.btn-whatsapp { background: #25D366; color: #fff; }
.btn-email { background: #FFD700; color: #000; }
.btn-confirm { background: #10B981; color: #fff; }
.btn-reset { background: #6B7280; color: #fff; }
.loading, .empty { text-align: center; padding: 3rem; color: #666; font-size: 1.2rem; }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; padding: 1rem; }
.modal { background: #fff; padding: 2rem; border-radius: 12px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal h3 { font-family: 'Montserrat', sans-serif; font-weight: 800; margin-bottom: 1rem; }
.modal input, .modal textarea { width: 100%; padding: 0.75rem; border: 2px solid #e0e0e0; border-radius: 6px; font-family: inherit; font-size: 1rem; margin-bottom: 1rem; }
.modal-buttons { display: flex; gap: 0.5rem; justify-content: flex-end; flex-wrap: wrap; }
.modal-btn { padding: 0.75rem 1.5rem; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
.modal-btn.primary { background: #FFD700; color: #000; }
.modal-btn.secondary { background: #e0e0e0; color: #000; }
.modal-btn.success { background: #25D366; color: #fff; }
.login-container { max-width: 400px; margin: 5rem auto; background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
.login-container h2 { font-family: 'Montserrat', sans-serif; font-weight: 900; margin-bottom: 1.5rem; }
.login-container input { width: 100%; padding: 1rem; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; margin-bottom: 1rem; }
.login-container button { width: 100%; padding: 1rem; background: #FFD700; color: #000; border: none; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; }
.hidden { display: none !important; }
@media (max-width: 768px) { .header h1 { font-size: 1.3rem; } .stat-card .value { font-size: 2rem; } .booking-actions { flex-direction: column; } .action-btn { width: 100%; justify-content: center; } }
</style>
</head>
<body>

<div id="loginScreen" class="login-container">
  <h2>🔒 HKJ ADMIN LOGIN</h2>
  <input type="password" id="adminPassword" placeholder="Enter admin password" onkeypress="if(event.key==='Enter')checkLogin()">
  <button onclick="checkLogin()">LOGIN</button>
</div>

<div id="dashboard" class="hidden">
  <div class="header">
    <h1>HKJ <span>ADMIN DASHBOARD</span></h1>
    <div class="header-buttons">
      <button class="btn btn-refresh" onclick="loadBookings()"><i class="fas fa-sync"></i> Refresh</button>
      <button class="btn btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="stats">
      <div class="stat-card"><h3>Total Trips</h3><div class="value" id="statTrips">0</div></div>
      <div class="stat-card revenue"><h3>Total Revenue</h3><div class="value" id="statRevenue">$0.00</div></div>
      <div class="stat-card pending"><h3>Pending Bookings</h3><div class="value" id="statPending">0</div></div>
    </div>

    <div class="bookings-section">
      <div class="section-header">
        <h2><i class="fas fa-list"></i> All Bookings</h2>
        <div class="filter-btns">
          <button class="filter-btn active" onclick="filterBookings('all', this)">All</button>
          <button class="filter-btn" onclick="filterBookings('Pending', this)">Pending</button>
          <button class="filter-btn" onclick="filterBookings('Price Sent', this)">Price Sent</button>
          <button class="filter-btn" onclick="filterBookings('Confirmed', this)">Confirmed</button>
          <button class="filter-btn" onclick="filterBookings('Completed', this)">Completed</button>
        </div>
      </div>
      <div id="bookingsList"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading bookings...</div></div>
    </div>
  </div>
</div>

<div id="modalOverlay" class="modal-overlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx6xDIYPUdE0Vxl3ndy1axkjX0Y6MWYYNRJ7tla1o-nUUPEMpcssfucjxL3qZIXnHdj/exec';
const ADMIN_PASSWORD = 'hkj5762';
let allBookings = [];
let currentFilter = 'all';

function checkLogin() {
  const pwd = document.getElementById('adminPassword').value;
  if (pwd === ADMIN_PASSWORD) {
    sessionStorage.setItem('hkj_admin', 'true');
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    loadBookings();
  } else { alert('Incorrect password!'); }
}
function logout() { sessionStorage.removeItem('hkj_admin'); location.reload(); }
if (sessionStorage.getItem('hkj_admin') === 'true') {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  loadBookings();
}

function getVal(b, names) {
  for (const name of names) {
    const key = Object.keys(b).find(k => k.trim().toUpperCase() === name.toUpperCase());
    if (key && b[key] !== undefined && b[key] !== '') return b[key];
  }
  return '';
}

function formatDate(dateString) {
  if (!dateString) return '';
  try {
    const date = new Date(dateString);
    const day = String(date.getUTCDate()).padStart(2, '0');
    const month = String(date.getUTCMonth() + 1).padStart(2, '0');
    const year = date.getUTCFullYear();
    return `${day}/${month}/${year}`;
  } catch (e) { return dateString; }
}
function formatTime(timeString) {
  if (!timeString) return '';
  try {
    const date = new Date(timeString);
    let hours = date.getUTCHours();
    const minutes = String(date.getUTCMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12; hours = hours ? hours : 12;
    return `${hours}:${minutes} ${ampm}`;
  } catch (e) { return timeString; }
}

async function loadBookings() {
  const list = document.getElementById('bookingsList');
  list.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading bookings...</div>';
  try {
    const response = await fetch(SCRIPT_URL);
    const data = await response.json();
    if (data.success && data.bookings) {
      allBookings = data.bookings;
      updateStats();
      renderBookings();
    } else { list.innerHTML = '<div class="empty">No data returned.</div>'; }
  } catch (error) { list.innerHTML = '<div class="empty">Failed to connect.</div>'; }
}

function updateStats() {
  const total = allBookings.length;
  const pending = allBookings.filter(b => getVal(b, ['STATUS']) === 'Pending').length;
  const revenue = allBookings.reduce((sum, b) => {
    const price = parseFloat(String(getVal(b, ['FINAL PRICE']) || '0').replace(/[^0-9.]/g, ''));
    return sum + (isNaN(price) ? 0 : price);
  }, 0);
  document.getElementById('statTrips').textContent = total;
  document.getElementById('statRevenue').textContent = '$' + revenue.toFixed(2);
  document.getElementById('statPending').textContent = pending;
}

function filterBookings(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderBookings();
}

function renderBookings() {
  const list = document.getElementById('bookingsList');
  const filtered = currentFilter === 'all' ? allBookings : allBookings.filter(b => getVal(b, ['STATUS']) === currentFilter);
  if (filtered.length === 0) { list.innerHTML = '<div class="empty">No bookings found</div>'; return; }
  
  list.innerHTML = filtered.map(b => {
    const status = getVal(b, ['STATUS']) || 'Pending';
    const price = getVal(b, ['FINAL PRICE']) ? '$' + getVal(b, ['FINAL PRICE']) : 'TBD';
    const phone = String(getVal(b, ['PHONE'])).replace(/[^0-9]/g, '');
    const name = getVal(b, ['NAME']) || 'Unknown';
    const refCode = getVal(b, ['REF CODE']) || 'N/A';
    const pickup = getVal(b, ['PICK UP']) || 'N/A';
    const dropoff = getVal(b, ['DROP OFF']) || 'N/A';
    const email = getVal(b, ['EMAIL']) || 'None';
    const rowNum = b._rowNumber;
    const formattedDate = formatDate(getVal(b, ['DATE']));
    const formattedTime = formatTime(getVal(b, ['TIME']));
    
    return `
      <div class="booking-card">
        <div class="booking-header">
          <div><div class="booking-ref">${refCode}</div><div style="font-weight:700;font-size:1.1rem;">${name}</div></div>
          <span class="status-badge status-${status.toLowerCase().replace(' ', '-')}">${status}</span>
        </div>
        <div class="booking-details">
          <div class="detail-item"><strong>Phone</strong><span>${getVal(b, ['PHONE']) || 'N/A'}</span></div>
          <div class="detail-item"><strong>Email</strong><span>${email}</span></div>
          <div class="detail-item"><strong>Date</strong><span>${formattedDate}</span></div>
          <div class="detail-item"><strong>Time</strong><span>${formattedTime}</span></div>
          <div class="detail-item"><strong>Pickup</strong><span>${pickup}</span></div>
          <div class="detail-item"><strong>Drop-off</strong><span>${dropoff}</span></div>
          <div class="detail-item"><strong>Final Price</strong><span class="price-display">${price}</span></div>
        </div>
        <div class="booking-actions">
          <button class="action-btn btn-calc" onclick="openCalcModal(${rowNum})"><i class="fas fa-calculator"></i> Calculate Fare</button>
          ${phone ? `<button class="action-btn btn-whatsapp" onclick="sendWhatsApp('${phone}', '${name}', '${refCode}', '${price}')"><i class="fab fa-whatsapp"></i> WhatsApp</button>` : ''}
          ${email !== 'None' ? `<button class="action-btn btn-email" onclick="openEmailModal(${rowNum})"><i class="fas fa-envelope"></i> Email</button>` : ''}
          <button class="action-btn btn-confirm" onclick="updateStatus(${rowNum}, 'Confirmed')"><i class="fas fa-check"></i> Confirm</button>
          <button class="action-btn btn-reset" onclick="updateStatus(${rowNum}, 'Pending')"><i class="fas fa-undo"></i> Reset</button>
        </div>
      </div>
    `;
  }).join('');
}

function sendWhatsApp(phone, name, refCode, price) {
  const msg = encodeURIComponent(`Hello ${name}, your final price for booking ${refCode} is ${price}. Please return to our website and confirm your booking using your code: https://hkjlogisticsltdtt.vercel.app/confirm.html`);
  window.open(`https://wa.me/1${phone}?text=${msg}`, '_blank');
}

// UPDATED CALC MODAL WITH TWO BUTTONS
function openCalcModal(rowNum) {
  const booking = allBookings.find(b => b._rowNumber === rowNum);
  document.getElementById('modalContent').innerHTML = `
    <h3><i class="fas fa-calculator"></i> Calculate Fare</h3>
    <p><strong>Pickup:</strong> ${getVal(booking, ['PICK UP'])}</p>
    <p><strong>Drop-off:</strong> ${getVal(booking, ['DROP OFF'])}</p>
    <hr style="margin:1rem 0;">
    <label><strong>Enter Final Price (TTD):</strong></label>
    <input type="number" id="calcPrice" placeholder="e.g. 250" step="0.01">
    <div class="modal-buttons">
      <button class="modal-btn secondary" onclick="closeModal()">Cancel</button>
      <button class="modal-btn primary" onclick="applyPriceOnly(${rowNum})">Apply Price Only</button>
      <button class="modal-btn success" onclick="applyAndSend(${rowNum})">Apply & Send WhatsApp</button>
    </div>
  `;
  document.getElementById('modalOverlay').style.display = 'flex';
}

async function applyPriceOnly(rowNum) {
  const price = document.getElementById('calcPrice').value;
  if (!price) { alert('Please enter a price'); return; }
  await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: `action=updatePrice&row=${rowNum}&price=${price}` });
  closeModal();
  alert('✅ Price saved to sheet!');
  setTimeout(() => loadBookings(), 1000);
}

async function applyAndSend(rowNum) {
  const price = document.getElementById('calcPrice').value;
  if (!price) { alert('Please enter a price'); return; }
  await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: `action=updatePrice&row=${rowNum}&price=${price}` });
  closeModal();
  const booking = allBookings.find(b => b._rowNumber === rowNum);
  const phone = String(getVal(booking, ['PHONE'])).replace(/[^0-9]/g, '');
  const name = getVal(booking, ['NAME']);
  const refCode = getVal(booking, ['REF CODE']);
  if (phone) {
    const waMessage = encodeURIComponent(`Hello ${name}, your final price for booking ${refCode} is $${price} TTD. Please return to our website and confirm your booking using your code: https://hkjlogisticsltdtt.vercel.app/confirm.html`);
    window.open(`https://wa.me/1${phone}?text=${waMessage}`, '_blank');
  }
  setTimeout(() => loadBookings(), 1000);
}

// UPDATED EMAIL MODAL WITH BOLD RED PRICE
function openEmailModal(rowNum) {
  const booking = allBookings.find(b => b._rowNumber === rowNum);
  const price = getVal(booking, ['FINAL PRICE']) || 'TBD';
  document.getElementById('modalContent').innerHTML = `
    <h3><i class="fas fa-envelope"></i> Send Email</h3>
    <p><strong>To:</strong> ${getVal(booking, ['EMAIL'])}</p>
    <label><strong>Message (HTML supported):</strong></label>
    <textarea id="emailMsg" rows="8">Hello <b>${getVal(booking, ['NAME'])}</b>,<br><br>Thank you for booking with HKJ Logistics!<br><br>Your final price for the trip is:<br><b style="color: #DC2626; font-size: 1.5em;">$${price} TTD</b><br><br>Reference Code: <b>${getVal(booking, ['REF CODE'])}</b><br><br>Please reply to confirm or visit our website.<br><br>Thank you,<br>HKJ Logistics Ltd</textarea>
    <div class="modal-buttons">
      <button class="modal-btn secondary" onclick="closeModal()">Cancel</button>
      <button class="modal-btn primary" onclick="sendEmail(${rowNum})">Send Email</button>
    </div>
  `;
  document.getElementById('modalOverlay').style.display = 'flex';
}

async function sendEmail(rowNum) {
  const booking = allBookings.find(b => b._rowNumber === rowNum);
  const msg = document.getElementById('emailMsg').value;
  const email = getVal(booking, ['EMAIL']);
  const refCode = getVal(booking, ['REF CODE']);
  
  await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: `action=sendEmail&row=${rowNum}&email=${encodeURIComponent(email)}&subject=${encodeURIComponent('Your HKJ Booking ' + refCode)}&message=${encodeURIComponent(msg)}&isHtml=true`
  });
  
  closeModal();
  alert('Email sent!');
  loadBookings();
}

async function updateStatus(rowNum, status) {
  if (!confirm(`Mark as ${status}?`)) return;
  await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: `action=updateStatus&row=${rowNum}&status=${status}` });
  alert(`Status updated to ${status}!`);
  loadBookings();
}

function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
</script>
</body>
</html>
