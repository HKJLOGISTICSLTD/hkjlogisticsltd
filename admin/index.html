<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - HKJ Logistics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f3f4f6; }
    .status-pending { background-color: #fef3c7; color: #92400e; }
    .status-confirmed { background-color: #dbeafe; color: #1e40af; }
    .status-completed { background-color: #dcfce7; color: #166534; }
    .status-cancelled { background-color: #fee2e2; color: #991b1b; }
    .status-price-sent { background-color: #f3e8ff; color: #6b21a8; }
  </style>
</head>
<body class="p-6">

  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="bg-white rounded-xl shadow-md p-6 mb-6 flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold text-gray-800">HKJ Logistics Admin</h1>
        <p class="text-gray-500">Manage bookings and set prices</p>
      </div>
      <button onclick="fetchBookings()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold transition">
        <i class="fas fa-sync-alt mr-2"></i> Refresh
      </button>
    </div>

    <!-- Loading State -->
    <div id="loading" class="text-center py-20">
      <i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i>
      <p class="mt-4 text-gray-600">Loading bookings...</p>
    </div>

    <!-- Bookings Grid -->
    <div id="bookingsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
      <!-- Cards will be injected here by JavaScript -->
    </div>
  </div>

  <script>
    // ==========================================
    // ️ REPLACE WITH YOUR APPS SCRIPT URL
    // ==========================================
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzr4DHnIpxJKiMj9Ktb0nAxQrhRDfBvho573bf98S9TbNKMWZvCw8CxfceuXDsmTyPtGQ/exec';

    async function fetchBookings() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('bookingsGrid').classList.add('hidden');

      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();

        if (data.success) {
          renderBookings(data.bookings);
        } else {
          alert('Error loading bookings.');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please try again.');
      } finally {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('bookingsGrid').classList.remove('hidden');
      }
    }

    // Smart Pricing Logic
    function calculateSuggestedPrice(pickup, dropoff) {
      const p = (pickup || '').toLowerCase();
      const d = (dropoff || '').toLowerCase();

      // 1. Check for Airports (Higher fare)
      if (p.includes('piarco') || d.includes('piarco') || p.includes('airport') || d.includes('airport')) {
        return 400;
      }

      // 2. Check for common cities to determine zones
      const cities = ['port of spain', 'chaguanas', 'san fernando', 'arima', 'point fortin', 'scarborough', 'tobago'];
      let pCity = cities.find(c => p.includes(c)) || 'other';
      let dCity = cities.find(c => d.includes(c)) || 'other';

      // 3. Same city = lower fare
      if (pCity === dCity) {
        return 200;
      }

      // 4. Different cities = standard cross-town fare
      return 350;
    }

    function renderBookings(bookings) {
      const grid = document.getElementById('bookingsGrid');
      grid.innerHTML = '';

      // Sort by newest first
      bookings.reverse().forEach(booking => {
        const row = booking._rowNumber;
        const status = (booking.STATUS || 'Pending').toLowerCase().replace(' ', '-');
        const price = booking['FINAL PRICE'] || '';
        
        // Calculate suggested price for the button
        const suggestedPrice = calculateSuggestedPrice(booking['PICK UP'], booking['DROP OFF']);

        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow-md p-6 border-l-4 border-blue-500';
        card.innerHTML = `
          <div class="flex justify-between items-start mb-4">
            <div>
              <h3 class="text-xl font-bold text-gray-800">${booking['REF CODE'] || 'N/A'}</h3>
              <p class="text-sm text-gray-500">${booking.NAME || 'Unknown'}</p>
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-bold uppercase status-${status}">
              ${booking.STATUS || 'Pending'}
            </span>
          </div>

          <div class="space-y-3 mb-4 text-sm">
            <div class="flex items-start">
              <i class="fas fa-map-marker-alt text-green-500 mt-1 mr-2"></i>
              <div>
                <p class="font-bold text-gray-700">Pickup:</p>
                <p class="text-gray-600">${booking['PICK UP'] || 'N/A'}</p>
              </div>
            </div>
            <div class="flex items-start">
              <i class="fas fa-flag-checkered text-red-500 mt-1 mr-2"></i>
              <div>
                <p class="font-bold text-gray-700">Drop-off:</p>
                <p class="text-gray-600">${booking['DROP OFF'] || 'N/A'}</p>
              </div>
            </div>
            <div class="flex items-center text-gray-600">
              <i class="fas fa-calendar-alt mr-2"></i> ${booking.DATE || 'N/A'} at ${booking.TIME || 'N/A'}
            </div>
            <div class="flex items-center text-gray-600">
              <i class="fas fa-phone mr-2"></i> ${booking.PHONE || 'N/A'}
            </div>
            ${booking.NOTES ? `<div class="bg-yellow-50 p-2 rounded text-yellow-800 text-xs"><i class="fas fa-sticky-note mr-1"></i> ${booking.NOTES}</div>` : ''}
          </div>

          <!-- Pricing Section -->
          <div class="border-t pt-4 mb-4">
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Final Price (TTD)</label>
            <div class="flex gap-2">
              <input type="number" id="price-${row}" value="${price}" placeholder="0.00" 
                class="flex-1 p-2 border rounded-lg focus:outline-none focus:border-blue-500">
              <button onclick="setSuggestedPrice(${row}, ${suggestedPrice})" 
                class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-lg text-xs font-bold transition" title="Auto-suggest price">
                <i class="fas fa-magic"></i>
              </button>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="grid grid-cols-2 gap-2">
            <button onclick="updatePrice(${row})" class="bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-bold text-sm transition">
              <i class="fas fa-paper-plane mr-1"></i> Send Price
            </button>
            <a href="${booking['WHATSAPP LINK'] || '#'}" target="_blank" class="bg-[#25D366] hover:bg-[#128C7E] text-white py-2 rounded-lg font-bold text-sm transition text-center flex items-center justify-center">
              <i class="fab fa-whatsapp mr-1"></i> WhatsApp
            </a>
          </div>

          <!-- Status Update -->
          <div class="mt-4">
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Update Status</label>
            <select onchange="updateStatus(${row}, this.value)" class="w-full p-2 border rounded-lg focus:outline-none focus:border-blue-500">
              <option value="Pending" ${booking.STATUS === 'Pending' ? 'selected' : ''}>Pending</option>
              <option value="Confirmed" ${booking.STATUS === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
              <option value="Price Sent" ${booking.STATUS === 'Price Sent' ? 'selected' : ''}>Price Sent</option>
              <option value="Completed" ${booking.STATUS === 'Completed' ? 'selected' : ''}>Completed</option>
              <option value="Cancelled" ${booking.STATUS === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
            </select>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function setSuggestedPrice(row, price) {
      document.getElementById(`price-${row}`).value = price;
    }

    async function updatePrice(row) {
      const price = document.getElementById(`price-${row}`).value;
      if (!price) return alert('Please enter a price.');

      const btn = event.target;
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
      btn.disabled = true;

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: new URLSearchParams({
            action: 'updatePrice',
            row: row,
            price: price
          })
        });
        const result = await response.json();
        if (result.success) {
          alert('Price sent to client successfully!');
          fetchBookings(); // Refresh to show updated status
        } else {
          alert('Error sending price.');
        }
      } catch (error) {
        alert('Network error.');
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    async function updateStatus(row, status) {
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: new URLSearchParams({
            action: 'updateStatus',
            row: row,
            status: status
          })
        });
        const result = await response.json();
        if (result.success) {
          fetchBookings(); // Refresh to update the badge color
        }
      } catch (error) {
        alert('Error updating status.');
      }
    }

    // Load bookings on page load
    window.addEventListener('DOMContentLoaded', fetchBookings);
  </script>
</body>
</html>
