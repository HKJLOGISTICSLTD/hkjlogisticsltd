<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HKJ Logistics Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=2073&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .status-pending { @apply bg-yellow-100 text-yellow-800; }
    .status-pricesent { @apply bg-orange-100 text-orange-800; }
    .status-confirmed { @apply bg-blue-600 text-white; }
    .status-completed { @apply bg-green-500 text-white; }
    .status-cancelled { @apply bg-red-600 text-white; }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); z-index: 50;
      display: none; align-items: center; justify-content: center;
    }
    #login-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .status-dropdown select {
      cursor: pointer; font-weight: 600; padding: 0.5rem 1rem; border-radius: 0.5rem; border: 0; font-size: 0.875rem; transition: all 0.2s;
    }
  </style>
</head>
<body class="p-6">

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="glass-card rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4">
      <div class="text-center mb-6">
        <div class="text-6xl mb-4">🚗</div>
        <h2 class="text-3xl font-bold text-gray-800 mb-2">HKJ Logistics</h2>
        <p class="text-gray-600">Admin Access</p>
      </div>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-2"><i class="fas fa-lock mr-2"></i>Password</label>
          <input type="password" id="password" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition" placeholder="Enter admin password" required>
        </div>
        <div id="error-message" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm">
          <i class="fas fa-exclamation-circle mr-2"></i>Incorrect password.
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold py-3 px-4 rounded-lg transition transform hover:scale-105 shadow-lg">
          <i class="fas fa-sign-in-alt mr-2"></i>Login
        </button>
      </form>
    </div>
  </div>

  <!-- ADMIN CONTENT -->
  <div id="admin-content" style="display: none;">
    
    <!-- EDIT MODAL -->
    <div id="edit-modal" class="modal-overlay">
      <div class="glass-card rounded-xl shadow-2xl p-6 max-w-md w-full mx-4 relative">
        <button onclick="closeEditModal()" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 text-xl"><i class="fas fa-times"></i></button>
        <h2 class="text-2xl font-bold mb-4 text-gray-800"><i class="fas fa-edit mr-2"></i>Edit Booking</h2>
        <input type="hidden" id="edit-row">
        <div class="space-y-3">
          <div><label class="block text-xs font-bold text-gray-600 mb-1">Date</label><input type="date" id="edit-date" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500"></div>
          <div><label class="block text-xs font-bold text-gray-600 mb-1">Time</label><input type="time" id="edit-time" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500"></div>
          <div><label class="block text-xs font-bold text-gray-600 mb-1">Phone</label><input type="text" id="edit-phone" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500"></div>
          <div><label class="block text-xs font-bold text-gray-600 mb-1">Pickup Location</label><textarea id="edit-pickup" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500" rows="2"></textarea></div>
          <div><label class="block text-xs font-bold text-gray-600 mb-1">Drop-off Location</label><textarea id="edit-dropoff" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500" rows="2"></textarea></div>
        </div>
        <button onclick="saveEdit()" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">Save Changes</button>
      </div>
    </div>

    <div class="max-w-7xl mx-auto">
      <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <div>
          <h1 class="text-4xl font-bold text-white mb-2 drop-shadow-lg"> HKJ Logistics Admin</h1>
          <p class="text-blue-100 text-sm drop-shadow">Managing bookings from beautiful Trinidad & Tobago </p>
        </div>
        <div class="flex gap-4">
          <button onclick="loadBookings()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg shadow-lg transition flex items-center">
            <i class="fas fa-sync-alt mr-2"></i> Refresh
          </button>
          <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg shadow-lg transition flex items-center">
            <i class="fas fa-sign-out-alt mr-2"></i> Logout
          </button>
        </div>
      </div>

      <div id="loading" class="hidden text-center py-12">
        <div class="glass-card inline-block px-8 py-6 rounded-xl shadow-xl">
          <i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i>
          <p class="mt-4 text-gray-700 font-semibold">Loading bookings...</p>
        </div>
      </div>

      <div id="bookings-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚠️ REPLACE THIS WITH YOUR ACTUAL APPS SCRIPT URL
    // ==========================================
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx6xDIYPUdE0Vxl3ndy1axkjX0Y6MWYYNRJ7tla1o-nUUPEMpcssfucjxL3qZIXnHdj/exec';
    const ADMIN_PASSWORD = 'hkj5762';
    let allBookings = [];

    window.addEventListener('DOMContentLoaded', function() {
      if (sessionStorage.getItem('hkj_admin_auth') === 'true') {
        showAdminContent();
        loadBookings();
      }
    });

    function handleLogin(event) {
      event.preventDefault();
      const passwordInput = document.getElementById('password').value;
      const errorMessage = document.getElementById('error-message');
      if (passwordInput === ADMIN_PASSWORD) {
        sessionStorage.setItem('hkj_admin_auth', 'true');
        showAdminContent();
        loadBookings();
      } else {
        errorMessage.classList.remove('hidden');
        document.getElementById('password').value = '';
        setTimeout(() => errorMessage.classList.add('hidden'), 3000);
      }
    }

    function showAdminContent() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-content').style.display = 'block';
    }

    function logout() {
      sessionStorage.removeItem('hkj_admin_auth');
      document.getElementById('admin-content').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('password').value = '';
    }

    function loadBookings() {
      const container = document.getElementById('bookings-container');
      const loading = document.getElementById('loading');
      container.innerHTML = '';
      loading.classList.remove('hidden');

      fetch(APPS_SCRIPT_URL)
        .then(response => response.json())
        .then(data => {
          loading.classList.add('hidden');
          if (data.success && data.bookings.length > 0) {
            allBookings = data.bookings.sort((a, b) => new Date(b.DATE) - new Date(a.DATE));
            allBookings.forEach(booking => renderBookingCard(booking));
          } else {
            container.innerHTML = '<div class="glass-card col-span-full text-center p-8 rounded-xl shadow-xl"><p class="text-gray-700 text-lg">No bookings found.</p></div>';
          }
        })
        .catch(error => {
          loading.classList.add('hidden');
          console.error('Error:', error);
          container.innerHTML = '<div class="glass-card col-span-full text-center p-8 rounded-xl shadow-xl"><p class="text-red-600 text-lg">Error loading bookings.</p></div>';
        });
    }

    function getBookingByRow(rowNumber) {
      return allBookings.find(b => b._rowNumber === rowNumber);
    }

    function renderBookingCard(booking) {
      const container = document.getElementById('bookings-container');
      const statusClass = {
        'Pending': 'status-pending',
        'Price Sent': 'status-pricesent',
        'Confirmed': 'status-confirmed',
        'Completed': 'status-completed',
        'Cancelled': 'status-cancelled'
      }[booking.STATUS] || 'status-pending';

      let displayDate = booking.DATE;
      let displayTime = booking.TIME;
      if(booking.DATE && booking.DATE.includes('T')) displayDate = new Date(booking.DATE).toLocaleDateString();
      if(booking.TIME && booking.TIME.includes('T')) displayTime = new Date(booking.TIME).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

      const card = document.createElement('div');
      card.className = 'glass-card rounded-xl shadow-xl p-6 border border-white/50 hover:shadow-2xl transition transform hover:-translate-y-1 flex flex-col';
      
      card.innerHTML = `
        <div class="flex justify-between items-start mb-4">
          <div class="status-dropdown">
            <select onchange="updateStatus(${booking._rowNumber}, this.value)" class="${statusClass}">
              <option value="Pending" ${booking.STATUS === 'Pending' ? 'selected' : ''}>Pending</option>
              <option value="Price Sent" ${booking.STATUS === 'Price Sent' ? 'selected' : ''}>Price Sent</option>
              <option value="Confirmed" ${booking.STATUS === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
              <option value="Completed" ${booking.STATUS === 'Completed' ? 'selected' : ''}>Completed</option>
              <option value="Cancelled" ${booking.STATUS === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
            </select>
          </div>
          <span class="text-sm text-gray-500 font-mono bg-gray-100 px-2 py-1 rounded">${booking['REF CODE'] || 'N/A'}</span>
        </div>
        <h3 class="text-2xl font-bold text-gray-800 mb-3">${booking.NAME || 'Unknown Client'}</h3>
        <div class="space-y-2 text-sm text-gray-700 mb-4 flex-grow">
          <p class="flex items-center"><i class="fas fa-calendar-alt w-6 text-blue-600"></i> <span class="ml-2"><strong>Date:</strong> ${displayDate}</span></p>
          <p class="flex items-center"><i class="fas fa-clock w-6 text-blue-600"></i> <span class="ml-2"><strong>Time:</strong> ${displayTime}</span></p>
          <p class="flex items-start mt-3">
            <i class="fas fa-map-marker-alt w-6 text-red-600 mt-1"></i> 
            <span class="ml-2 flex-grow"><strong>Pickup:</strong> ${booking['PICK UP'] || 'N/A'}</span>
            <button onclick="copyAddress('pickup', ${booking._rowNumber})" class="ml-2 text-gray-400 hover:text-blue-600" title="Copy Address"><i class="fas fa-copy"></i></button>
          </p>
          <p class="flex items-start">
            <i class="fas fa-flag-checkered w-6 text-green-600 mt-1"></i> 
            <span class="ml-2 flex-grow"><strong>Drop-off:</strong> ${booking['DROP OFF'] || 'N/A'}</span>
            <button onclick="copyAddress('dropoff', ${booking._rowNumber})" class="ml-2 text-gray-400 hover:text-blue-600" title="Copy Address"><i class="fas fa-copy"></i></button>
          </p>
          <p class="flex items-center mt-3">
            <i class="fas fa-phone w-6 text-purple-600"></i> 
            <a href="tel:${booking.PHONE}" class="ml-2 font-bold text-purple-700 hover:underline">${booking.PHONE || 'No Phone'}</a>
          </p>
          <p class="flex items-center"><i class="fas fa-envelope w-6 text-orange-600"></i> <span class="ml-2">${booking.EMAIL || 'No Email'}</span></p>
          <div class="border-t border-gray-300 my-3"></div>
          <p class="text-2xl font-bold text-red-600 flex items-center">
            <i class="fas fa-dollar-sign w-6"></i> <span>Final Price: $${booking['FINAL PRICE'] || '0.00'} TTD</span>
          </p>
        </div>
        <div class="grid grid-cols-2 gap-2 mt-4">
          <button onclick="openEditModal(${booking._rowNumber})" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded text-sm font-semibold transition"><i class="fas fa-edit mr-1"></i> Edit</button>
          <button onclick="sendWhatsApp(${booking._rowNumber})" class="bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded text-sm font-semibold transition"><i class="fab fa-whatsapp mr-1"></i> WhatsApp</button>
          <button onclick="sendEmailFromAdmin(${booking._rowNumber})" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded text-sm font-semibold transition col-span-2"><i class="fas fa-envelope mr-1"></i> Send Confirmation Email</button>
          <button onclick="updatePrice(${booking._rowNumber})" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2 rounded text-sm font-semibold transition"><i class="fas fa-calculator mr-1"></i> Price</button>
          <button onclick="markAsCompleted(${booking._rowNumber})" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded text-sm font-semibold transition"><i class="fas fa-check-circle mr-1"></i> Completed</button>
          <button onclick="resetStatus(${booking._rowNumber})" class="bg-gray-500 hover:bg-gray-600 text-white px-3 py-2 rounded text-sm font-semibold transition col-span-2"><i class="fas fa-undo mr-1"></i> Reset to Pending</button>
        </div>
      `;
      container.appendChild(card);
    }

    function copyAddress(type, rowNumber) {
      const booking = getBookingByRow(rowNumber);
      const text = type === 'pickup' ? booking['PICK UP'] : booking['DROP OFF'];
      navigator.clipboard.writeText(text).then(() => alert('Address copied to clipboard!'));
    }

    function sendWhatsApp(rowNumber) {
      const booking = getBookingByRow(rowNumber);
      if(!booking.PHONE) { alert('No phone number'); return; }
      const cleanPhone = booking.PHONE.replace(/[^0-9]/g, '');
      const msg = `Hello ${booking.NAME}, your final price for booking ${booking['REF CODE']} is $${booking['FINAL PRICE']} TTD. Please click this link to confirm: https://hkjlogisticsltdtt.vercel.app/confirm.html?code=${booking['REF CODE']}`;
      window.open(`https://wa.me/1${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function sendEmailFromAdmin(rowNumber) {
      const booking = getBookingByRow(rowNumber);
      if(!booking.EMAIL || !booking.EMAIL.includes('@')) { alert('No valid email address'); return; }
      if(!confirm(`Send confirmation email to ${booking.NAME}?`)) return;
      
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'sendEmail',
          row: rowNumber,
          email: booking.EMAIL,
          name: booking.NAME,
          refCode: booking['REF CODE'],
          price: booking['FINAL PRICE'],
          pickup: booking['PICK UP'],
          dropoff: booking['DROP OFF'],
          date: booking.DATE
        })
      })
      .then(res => res.json())
      .then(data => { 
        if (data.success) alert('✅ Email sent successfully!'); 
        else alert('❌ Error sending email: ' + (data.message || 'Unknown error')); 
      })
      .catch(err => alert('Network error: ' + err));
    }

    function updateStatus(rowNumber, newStatus) {
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'updateStatus',
          row: rowNumber,
          status: newStatus
        })
      })
      .then(res => res.json())
      .then(data => {
        if(data.success) {
          const booking = getBookingByRow(rowNumber);
          if(booking) booking.STATUS = newStatus;
          renderAllBookings();
        } else {
          alert('❌ Error updating status');
          loadBookings();
        }
      })
      .catch(err => {
        alert('Network error');
        loadBookings();
      });
    }

    function renderAllBookings() {
      const container = document.getElementById('bookings-container');
      container.innerHTML = '';
      allBookings.forEach(booking => renderBookingCard(booking));
    }

    function openEditModal(rowNumber) {
      const booking = getBookingByRow(rowNumber);
      document.getElementById('edit-row').value = rowNumber;
      
      let dateVal = booking.DATE;
      if(dateVal && dateVal.includes('T')) dateVal = dateVal.split('T')[0];
      
      let timeVal = booking.TIME;
      if(timeVal && timeVal.includes('T')) {
        const d = new Date(timeVal);
        timeVal = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      }

      document.getElementById('edit-date').value = dateVal || '';
      document.getElementById('edit-time').value = timeVal || '';
      document.getElementById('edit-phone').value = booking.PHONE || '';
      document.getElementById('edit-pickup').value = booking['PICK UP'] || '';
      document.getElementById('edit-dropoff').value = booking['DROP OFF'] || '';
      
      document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() { document.getElementById('edit-modal').style.display = 'none'; }

    function saveEdit() {
      const row = document.getElementById('edit-row').value;
      const date = document.getElementById('edit-date').value;
      const time = document.getElementById('edit-time').value;
      const phone = document.getElementById('edit-phone').value;
      const pickup = document.getElementById('edit-pickup').value;
      const dropoff = document.getElementById('edit-dropoff').value;
      
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: new URLSearchParams({ 
          action: 'updateBooking', 
          row: row, 
          date: date, 
          time: time, 
          phone: phone, 
          pickup: pickup, 
          dropoff: dropoff 
        })
      })
      .then(res => res.json())
      .then(data => { 
        if (data.success) { 
          alert('✅ Booking updated!'); 
          closeEditModal(); 
          loadBookings(); 
        } else alert('❌ Error updating: ' + (data.message || 'Unknown error')); 
      })
      .catch(err => alert('Network error: ' + err));
    }

    function updatePrice(rowNumber) {
      const newPrice = prompt('Enter the new final price:');
      if (!newPrice) return;
      fetch(APPS_SCRIPT_URL, { 
        method: 'POST', 
        body: new URLSearchParams({ action: 'updatePrice', row: rowNumber, price: newPrice }) 
      })
      .then(res => res.json())
      .then(data => { 
        if(data.success) { alert('✅ Price updated!'); loadBookings(); } 
        else alert('❌ Error: ' + (data.message || 'Unknown error'));
      })
      .catch(err => alert('Network error: ' + err));
    }

    function markAsCompleted(rowNumber) {
      updateStatus(rowNumber, 'Completed');
    }

    function resetStatus(rowNumber) {
      updateStatus(rowNumber, 'Pending');
    }
  </script>
</body>
</html>
