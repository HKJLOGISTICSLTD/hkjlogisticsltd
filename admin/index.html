<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HKJ Logistics Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=2073&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
    }
    .status-pending { @apply bg-yellow-100 text-yellow-800; }
    .status-pricesent { @apply bg-orange-100 text-orange-800; }
    .status-confirmed { @apply bg-green-100 text-green-800; }
    .status-completed { @apply bg-blue-100 text-blue-800; }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    /* Modal Styles */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); z-index: 50;
      display: none; align-items: center; justify-content: center;
    }
  </style>
</head>
<body class="p-6">

  <!-- EDIT MODAL -->
  <div id="edit-modal" class="modal-overlay">
    <div class="glass-card rounded-xl shadow-2xl p-6 max-w-md w-full mx-4 relative">
      <button onclick="closeEditModal()" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 text-xl"><i class="fas fa-times"></i></button>
      <h2 class="text-2xl font-bold mb-4 text-gray-800"><i class="fas fa-edit mr-2"></i>Edit Booking</h2>
      <input type="hidden" id="edit-row">
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">Date</label>
          <input type="date" id="edit-date" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">Time</label>
          <input type="time" id="edit-time" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">Phone</label>
          <input type="text" id="edit-phone" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">Pickup Location</label>
          <textarea id="edit-pickup" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500" rows="2"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">Drop-off Location</label>
          <textarea id="edit-dropoff" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500" rows="2"></textarea>
        </div>
      </div>
      
      <button onclick="saveEdit()" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
        Save Changes
      </button>
    </div>
  </div>

  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
      <div>
        <h1 class="text-4xl font-bold text-white mb-2 drop-shadow-lg">🚗 HKJ Logistics Admin</h1>
        <p class="text-blue-100 text-sm drop-shadow">Managing bookings from beautiful Trinidad & Tobago 🌴</p>
      </div>
      <div class="flex gap-4">
        <button onclick="loadBookings()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg shadow-lg transition flex items-center">
          <i class="fas fa-sync-alt mr-2"></i> Refresh
        </button>
        <a href="/" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg shadow-lg transition flex items-center">
          <i class="fas fa-sign-out-alt mr-2"></i> Logout
        </a>
      </div>
    </div>

    <div id="loading" class="hidden text-center py-12">
      <div class="glass-card inline-block px-8 py-6 rounded-xl shadow-xl">
        <i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i>
        <p class="mt-4 text-gray-700 font-semibold">Loading bookings...</p>
      </div>
    </div>

    <div id="bookings-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx6xDIYPUdE0Vxl3ndy1axkjX0Y6MWYYNRJ7tla1o-nUUPEMpcssfucjxL3qZIXnHdj/exec';

    document.addEventListener('DOMContentLoaded', loadBookings);

    function loadBookings() {
      const container = document.getElementById('bookings-container');
      const loading = document.getElementById('loading');
      container.innerHTML = '';
      loading.classList.remove('hidden');

      fetch(APPS_SCRIPT_URL)
        .then(response => response.json())
        .then(data => {
          loading.classList.add('hidden');
          if (data.success && data.bookings.length > 0) {
            const sortedBookings = data.bookings.sort((a, b) => new Date(b.DATE) - new Date(a.DATE));
            sortedBookings.forEach(booking => renderBookingCard(booking));
          } else {
            container.innerHTML = '<div class="glass-card col-span-full text-center p-8 rounded-xl shadow-xl"><p class="text-gray-700 text-lg">No bookings found.</p></div>';
          }
        })
        .catch(error => {
          loading.classList.add('hidden');
          console.error('Error:', error);
          container.innerHTML = '<div class="glass-card col-span-full text-center p-8 rounded-xl shadow-xl"><p class="text-red-600 text-lg">Error loading bookings.</p></div>';
        });
    }

    function renderBookingCard(booking) {
      const container = document.getElementById('bookings-container');
      const statusClass = {
        'Pending': 'status-pending', 'Price Sent': 'status-pricesent',
        'Confirmed': 'status-confirmed', 'Completed': 'status-completed'
      }[booking.STATUS] || 'bg-gray-100 text-gray-800';

      // Format Date/Time for display
      let displayDate = booking.DATE;
      let displayTime = booking.TIME;
      if(booking.DATE && booking.DATE.includes('T')) displayDate = new Date(booking.DATE).toLocaleDateString();
      if(booking.TIME && booking.TIME.includes('T')) displayTime = new Date(booking.TIME).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

      const card = document.createElement('div');
      card.className = 'glass-card rounded-xl shadow-xl p-6 border border-white/50 hover:shadow-2xl transition transform hover:-translate-y-1 flex flex-col';
      
      card.innerHTML = `
        <div class="flex justify-between items-start mb-4">
          <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide ${statusClass}">
            ${booking.STATUS || 'Pending'}
          </span>
          <span class="text-sm text-gray-500 font-mono bg-gray-100 px-2 py-1 rounded">${booking['REF CODE'] || 'N/A'}</span>
        </div>
        
        <h3 class="text-2xl font-bold text-gray-800 mb-3">${booking.NAME || 'Unknown Client'}</h3>
        
        <div class="space-y-2 text-sm text-gray-700 mb-4 flex-grow">
          <p class="flex items-center"><i class="fas fa-calendar-alt w-6 text-blue-600"></i> <span class="ml-2"><strong>Date:</strong> ${displayDate}</span></p>
          <p class="flex items-center"><i class="fas fa-clock w-6 text-blue-600"></i> <span class="ml-2"><strong>Time:</strong> ${displayTime}</span></p>
          
          <p class="flex items-start mt-3">
            <i class="fas fa-map-marker-alt w-6 text-red-600 mt-1"></i> 
            <span class="ml-2 flex-grow"><strong>Pickup:</strong> ${booking['PICK UP'] || 'N/A'}</span>
            <button onclick="copyText('${booking['PICK UP']}')" class="ml-2 text-gray-400 hover:text-blue-600" title="Copy Address"><i class="fas fa-copy"></i></button>
          </p>
          
          <p class="flex items-start">
            <i class="fas fa-flag-checkered w-6 text-green-600 mt-1"></i> 
            <span class="ml-2 flex-grow"><strong>Drop-off:</strong> ${booking['DROP OFF'] || 'N/A'}</span>
            <button onclick="copyText('${booking['DROP OFF']}')" class="ml-2 text-gray-400 hover:text-blue-600" title="Copy Address"><i class="fas fa-copy"></i></button>
          </p>
          
          <p class="flex items-center mt-3">
            <i class="fas fa-phone w-6 text-purple-600"></i> 
            <a href="tel:${booking.PHONE}" class="ml-2 font-bold text-purple-700 hover:underline">${booking.PHONE || 'No Phone'}</a>
          </p>
          <p class="flex items-center"><i class="fas fa-envelope w-6 text-orange-600"></i> <span class="ml-2">${booking.EMAIL || 'No Email'}</span></p>
          
          <div class="border-t border-gray-300 my-3"></div>
          <p class="text-2xl font-bold text-red-600 flex items-center">
            <i class="fas fa-dollar-sign w-6"></i> <span>Final Price: $${booking['FINAL PRICE'] || '0.00'} TTD</span>
          </p>
        </div>

        <!-- Action Grid -->
        <div class="grid grid-cols-2 gap-2 mt-4">
          <button onclick="openEditModal(${booking._rowNumber}, '${booking.DATE}', '${booking.TIME}', '${booking.PHONE}', '${booking['PICK UP']}', '${booking['DROP OFF']}')" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded text-sm font-semibold transition">
            <i class="fas fa-edit mr-1"></i> Edit
          </button>
          
          <button onclick="sendWhatsApp('${booking.PHONE}', '${booking.NAME}', '${booking['REF CODE']}', '${booking['FINAL PRICE']}')" class="bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded text-sm font-semibold transition">
            <i class="fab fa-whatsapp mr-1"></i> WhatsApp
          </button>
          
          <button onclick="sendEmailFromAdmin(${booking._rowNumber}, '${booking.EMAIL}', '${booking.NAME}', '${booking['REF CODE']}', '${booking['FINAL PRICE']}', '${booking['PICK UP']}', '${booking['DROP OFF']}', '${booking.DATE}')" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded text-sm font-semibold transition col-span-2">
            <i class="fas fa-envelope mr-1"></i> Send Confirmation Email
          </button>

          <button onclick="updatePrice(${booking._rowNumber})" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2 rounded text-sm font-semibold transition">
            <i class="fas fa-calculator mr-1"></i> Price
          </button>
          
          <button onclick="confirmBooking(${booking._rowNumber})" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded text-sm font-semibold transition">
            <i class="fas fa-check mr-1"></i> Confirm
          </button>
          
          <button onclick="markAsCompleted(${booking._rowNumber})" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded text-sm font-semibold transition col-span-2">
            <i class="fas fa-check-circle mr-1"></i> Mark Completed
          </button>
          
          <button onclick="resetStatus(${booking._rowNumber})" class="bg-gray-500 hover:bg-gray-600 text-white px-3 py-2 rounded text-sm font-semibold transition col-span-2">
            <i class="fas fa-undo mr-1"></i> Reset
          </button>
        </div>
      `;
      container.appendChild(card);
    }

    // --- NEW FUNCTIONS ---

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('Address copied to clipboard!');
      });
    }

    function sendWhatsApp(phone, name, code, price) {
      if(!phone) { alert('No phone number'); return; }
      const cleanPhone = phone.replace(/[^0-9]/g, '');
      const msg = `Hello ${name}, your final price for booking ${code} is $${price} TTD. Please click this link to confirm: https://hkjlogisticsltdtt.vercel.app/confirm.html?code=${code}`;
      window.open(`https://wa.me/1${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function sendEmailFromAdmin(row, email, name, code, price, pickup, dropoff, date) {
      if(!email || !email.includes('@')) { alert('No valid email address'); return; }
      if(!confirm(`Send confirmation email to ${name}?`)) return;

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'sendEmail', row: row, email: email, name: name, refCode: code,
          price: price, pickup: pickup, dropoff: dropoff, date: date
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) alert('✅ Email sent successfully!');
        else alert('❌ Error sending email.');
      })
      .catch(err => alert('Network error.'));
    }

    // Edit Modal Functions
    function openEditModal(row, date, time, phone, pickup, dropoff) {
      document.getElementById('edit-row').value = row;
      
      // Handle Date/Time formatting for input fields
      let dateVal = date;
      if(date && date.includes('T')) dateVal = date.split('T')[0];
      
      let timeVal = time;
      if(time && time.includes('T')) {
        const d = new Date(time);
        timeVal = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      }

      document.getElementById('edit-date').value = dateVal || '';
      document.getElementById('edit-time').value = timeVal || '';
      document.getElementById('edit-phone').value = phone || '';
      document.getElementById('edit-pickup').value = pickup || '';
      document.getElementById('edit-dropoff').value = dropoff || '';
      
      document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('edit-modal').style.display = 'none';
    }

    function saveEdit() {
      const row = document.getElementById('edit-row').value;
      const date = document.getElementById('edit-date').value;
      const time = document.getElementById('edit-time').value;
      const phone = document.getElementById('edit-phone').value;
      const pickup = document.getElementById('edit-pickup').value;
      const dropoff = document.getElementById('edit-dropoff').value;

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'updateBooking', row: row, date: date, time: time,
          phone: phone, pickup: pickup, dropoff: dropoff
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('✅ Booking updated!');
          closeEditModal();
          loadBookings();
        } else alert('❌ Error updating.');
      })
      .catch(err => alert('Network error.'));
    }

    // --- EXISTING FUNCTIONS ---
    function updatePrice(rowNumber) {
      const newPrice = prompt('Enter the new final price:');
      if (!newPrice) return;
      fetch(APPS_SCRIPT_URL, { method: 'POST', body: new URLSearchParams({ action: 'updatePrice', row: rowNumber, price: newPrice }) })
      .then(res => res.json()).then(data => { if(data.success) { alert('✅ Price updated!'); loadBookings(); } });
    }

    function confirmBooking(rowNumber) {
      if (!confirm('Mark as Confirmed?')) return;
      fetch(APPS_SCRIPT_URL, { method: 'POST', body: new URLSearchParams({ action: 'updateStatus', row: rowNumber, status: 'Confirmed' }) })
      .then(res => res.json()).then(data => { if(data.success) { alert('✅ Confirmed!'); loadBookings(); } });
    }

    function markAsCompleted(rowNumber) {
      if (!confirm('Mark as Completed?')) return;
      fetch(APPS_SCRIPT_URL, { method: 'POST', body: new URLSearchParams({ action: 'updateStatus', row: rowNumber, status: 'Completed' }) })
      .then(res => res.json()).then(data => { if(data.success) { alert('✅ Completed!'); loadBookings(); } });
    }

    function resetStatus(rowNumber) {
      if (!confirm('Reset to Pending?')) return;
      fetch(APPS_SCRIPT_URL, { method: 'POST', body: new URLSearchParams({ action: 'updateStatus', row: rowNumber, status: 'Pending' }) })
      .then(res => res.json()).then(data => { if(data.success) { alert('🔄 Reset!'); loadBookings(); } });
    }
  </script>
</body>
</html>
