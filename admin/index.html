<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HKJ Logistics Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Tropical Beach Background */
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=2073&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
    }
    
    .status-pending { @apply bg-yellow-100 text-yellow-800; }
    .status-pricesent { @apply bg-orange-100 text-orange-800; }
    .status-confirmed { @apply bg-green-100 text-green-800; }
    .status-completed { @apply bg-blue-100 text-blue-800; }
    
    /* Glassmorphism effect for cards */
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="p-6">

  <div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-4xl font-bold text-white mb-2 drop-shadow-lg">🚗 HKJ Logistics Admin</h1>
        <p class="text-blue-100 text-sm drop-shadow">Managing bookings from beautiful Trinidad & Tobago 🌴</p>
      </div>
      <button onclick="loadBookings()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg shadow-lg transition transform hover:scale-105">
        <i class="fas fa-sync-alt mr-2"></i> Refresh
      </button>
        <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-4xl font-bold text-white mb-2 drop-shadow-lg">🚗 HKJ Logistics Admin</h1>
        <p class="text-blue-100 text-sm drop-shadow">Managing bookings from beautiful Trinidad & Tobago 🌴</p>
      </div>
      <div class="flex gap-4">
        <button onclick="loadBookings()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg shadow-lg transition transform hover:scale-105 flex items-center">
          <i class="fas fa-sync-alt mr-2"></i> Refresh
        </button>
        
        <!-- LOGOUT BUTTON -->
        <a href="/" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg shadow-lg transition transform hover:scale-105 flex items-center">
          <i class="fas fa-sign-out-alt mr-2"></i> Logout
        </a>
      </div>
    </div>

    <!-- Bookings Container -->
    <div id="bookings-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Bookings will be injected here by JavaScript -->
    </div>
  </div>

  <script>
    // ==========================================
    // ⚠️ REPLACE THIS WITH YOUR ACTUAL APPS SCRIPT WEB APP URL
    // ==========================================
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx6xDIYPUdE0Vxl3ndy1axkjX0Y6MWYYNRJ7tla1o-nUUPEMpcssfucjxL3qZIXnHdj/exec';

    document.addEventListener('DOMContentLoaded', loadBookings);

    function loadBookings() {
      const container = document.getElementById('bookings-container');
      const loading = document.getElementById('loading');
      
      container.innerHTML = '';
      loading.classList.remove('hidden');

      fetch(APPS_SCRIPT_URL)
        .then(response => response.json())
        .then(data => {
          loading.classList.add('hidden');
          if (data.success && data.bookings.length > 0) {
            const sortedBookings = data.bookings.sort((a, b) => new Date(b.DATE) - new Date(a.DATE));
            sortedBookings.forEach(booking => renderBookingCard(booking));
          } else {
            container.innerHTML = '<div class="glass-card col-span-full text-center p-8 rounded-xl shadow-xl"><p class="text-gray-700 text-lg">No bookings found.</p></div>';
          }
        })
        .catch(error => {
          loading.classList.add('hidden');
          console.error('Error:', error);
          container.innerHTML = '<div class="glass-card col-span-full text-center p-8 rounded-xl shadow-xl"><p class="text-red-600 text-lg">Error loading bookings. Check console.</p></div>';
        });
    }

    function renderBookingCard(booking) {
      const container = document.getElementById('bookings-container');
      
      const statusClass = {
        'Pending': 'status-pending',
        'Price Sent': 'status-pricesent',
        'Confirmed': 'status-confirmed',
        'Completed': 'status-completed'
      }[booking.STATUS] || 'bg-gray-100 text-gray-800';

      const card = document.createElement('div');
      card.className = 'glass-card rounded-xl shadow-xl p-6 border border-white/50 hover:shadow-2xl transition transform hover:-translate-y-1';
      
      card.innerHTML = `
        <div class="flex justify-between items-start mb-4">
          <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide ${statusClass}">
            ${booking.STATUS || 'Pending'}
          </span>
          <span class="text-sm text-gray-500 font-mono bg-gray-100 px-2 py-1 rounded">${booking['REF CODE'] || 'N/A'}</span>
        </div>
        
        <h3 class="text-2xl font-bold text-gray-800 mb-3">${booking.NAME || 'Unknown Client'}</h3>
        
        <div class="space-y-2 text-sm text-gray-700 mb-4">
          <p class="flex items-center"><i class="fas fa-calendar-alt w-6 text-blue-600"></i> <span class="ml-2"><strong>Date:</strong> ${booking.DATE || 'N/A'}</span></p>
          <p class="flex items-center"><i class="fas fa-clock w-6 text-blue-600"></i> <span class="ml-2"><strong>Time:</strong> ${booking.TIME || 'N/A'}</span></p>
          <p class="flex items-start"><i class="fas fa-map-marker-alt w-6 text-red-600 mt-1"></i> <span class="ml-2"><strong>Pickup:</strong> ${booking['PICK UP'] || 'N/A'}</span></p>
          <p class="flex items-start"><i class="fas fa-flag-checkered w-6 text-green-600 mt-1"></i> <span class="ml-2"><strong>Drop-off:</strong> ${booking['DROP OFF'] || 'N/A'}</span></p>
          <p class="flex items-center"><i class="fas fa-phone w-6 text-purple-600"></i> <span class="ml-2"><strong>Phone:</strong> ${booking.PHONE || 'No Phone'}</span></p>
          <p class="flex items-center"><i class="fas fa-envelope w-6 text-orange-600"></i> <span class="ml-2"><strong>Email:</strong> ${booking.EMAIL || 'No Email'}</span></p>
          <div class="border-t border-gray-300 my-3"></div>
          <p class="text-2xl font-bold text-red-600 flex items-center">
            <i class="fas fa-dollar-sign w-6"></i> <span>Final Price: $${booking['FINAL PRICE'] || '0.00'} TTD</span>
          </p>
        </div>

        <div class="border-t border-gray-300 pt-4 mt-4 grid grid-cols-2 gap-3">
          <button onclick="updatePrice(${booking._rowNumber})" class="bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-600 hover:to-yellow-700 text-white px-4 py-3 rounded-lg text-sm font-semibold transition shadow-md hover:shadow-lg">
            <i class="fas fa-calculator mr-1"></i> Calc Price
          </button>
          
          <button onclick="confirmBooking(${booking._rowNumber})" class="bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-4 py-3 rounded-lg text-sm font-semibold transition shadow-md hover:shadow-lg">
            <i class="fas fa-check mr-1"></i> Confirm
          </button>
          
          <button onclick="markAsCompleted(${booking._rowNumber})" class="bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white px-4 py-3 rounded-lg text-sm font-semibold transition shadow-md hover:shadow-lg col-span-2">
            <i class="fas fa-check-circle mr-1"></i> Mark as Completed
          </button>
          
          <button onclick="resetStatus(${booking._rowNumber})" class="bg-gradient-to-r from-gray-500 to-gray-600 hover:from-gray-600 hover:to-gray-700 text-white px-4 py-3 rounded-lg text-sm font-semibold transition shadow-md hover:shadow-lg col-span-2">
            <i class="fas fa-undo mr-1"></i> Reset to Pending
          </button>
        </div>
      `;
      
      container.appendChild(card);
    }

    function updatePrice(rowNumber) {
      const newPrice = prompt('Enter the new final price (e.g., 250):');
      if (!newPrice) return;

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'updatePrice',
          row: rowNumber,
          price: newPrice
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('✅ Price updated and status set to "Price Sent"!');
          loadBookings();
        } else {
          alert('❌ Error updating price.');
        }
      })
      .catch(err => {
        console.error(err);
        alert('❌ Network error.');
      });
    }

    function confirmBooking(rowNumber) {
      if (!confirm('Mark this booking as Confirmed?')) return;
      
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'updateStatus',
          row: rowNumber,
          status: 'Confirmed'
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('✅ Booking Confirmed!');
          loadBookings();
        } else {
          alert('❌ Error confirming booking.');
        }
      })
      .catch(err => {
        console.error(err);
        alert('❌ Network error.');
      });
    }

    function markAsCompleted(rowNumber) {
      if (!confirm('Mark this booking as Completed?')) return;
      
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'updateStatus',
          row: rowNumber,
          status: 'Completed'
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('✅ Booking marked as Completed!');
          loadBookings();
        } else {
          alert('❌ Error updating status.');
        }
      })
      .catch(err => {
        console.error(err);
        alert('❌ Network error.');
      });
    }

    function resetStatus(rowNumber) {
      if (!confirm('Reset this booking status to Pending?')) return;
      
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: new URLSearchParams({
          action: 'updateStatus',
          row: rowNumber,
          status: 'Pending'
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('🔄 Status reset to Pending!');
          loadBookings();
        } else {
          alert('❌ Error resetting status.');
        }
      })
      .catch(err => {
        console.error(err);
        alert(' Network error.');
      });
    }
  </script>
</body>
</html>
